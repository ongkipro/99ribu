services:
  database:
    # Reap docker-exec orphan children outside the PostgreSQL postmaster.
    init: true
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    user: "${LOCAL_UID:?Use npm run db:up}:${LOCAL_GID:?Use npm run db:up}"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_DB: postgres
      # Trust is confined to the owner-only Unix socket. TCP is disabled.
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --auth-local=trust --auth-host=reject
    command: [postgres, -c, "listen_addresses=", -c, "unix_socket_permissions=0700"]
    volumes:
      - ./.local/postgres:/var/lib/postgresql
      - ./.local/pgsocket:/var/run/postgresql
      - ./src/db/bootstrap.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bootstrap -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    mem_limit: 512m
