    SupportEvent:
      type: object
      properties:
        cursor:
          type: string
          minLength: 1
          maxLength: 2000
        kind:
          type: string
          enum:
          - message
          - status
          - read_marker
        conversation_id:
          $ref: '#/components/schemas/Id'
        message:
          $ref: '#/components/schemas/SupportMessage'
        status:
          type: string
          enum:
          - open
          - waiting_customer
          - resolved
        read_marker:
          $ref: '#/components/schemas/SupportReadMarker'
      required:
      - cursor
      - kind
      - conversation_id
      additionalProperties: false
      description: Authenticated conversation-scoped resumable public event. Notes, assignment changes, private
        staff metadata and financial events are excluded; replay uses same visibility as history.
      allOf:
      - if:
          properties:
            kind:
              const: message
        then:
          required:
          - message
          properties:
            message:
              $ref: '#/components/schemas/SupportMessage'
      - if:
          properties:
            kind:
              const: status
        then:
          required:
          - status
          properties:
            status:
              type: string
              enum:
