        this contract.
    FinanceSummary:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/DateTime'
        to:
          $ref: '#/components/schemas/DateTime'
        as_of:
          $ref: '#/components/schemas/DateTime'
        currency:
          type: string
          const: IDR
        gross_merchandise:
          $ref: '#/components/schemas/FinancialMetric'
        estimated_contribution:
          $ref: '#/components/schemas/FinancialMetric'
        realized_contribution:
          $ref: '#/components/schemas/FinancialMetric'
        cash:
          $ref: '#/components/schemas/FinancialMetric'
        receivables:
          $ref: '#/components/schemas/FinancialMetric'
        refund_liability:
          $ref: '#/components/schemas/FinancialMetric'
        affiliate_liability:
          $ref: '#/components/schemas/FinancialMetric'
        cost_policy_version:
          type: integer
          minimum: 1
        basis:
          type: string
          const: period_flows_and_closing_balances
        net_merchandise_revenue:
          $ref: '#/components/schemas/FinancialMetric'
        recognized_hpp:
          $ref: '#/components/schemas/FinancialMetric'
        gross_merchandise_profit:
          $ref: '#/components/schemas/FinancialMetric'
        operating_expenses:
          $ref: '#/components/schemas/FinancialMetric'
        operating_result:
          $ref: '#/components/schemas/FinancialMetric'
        hpp_basis:
          type: string
          enum:
          - actual_lot_cost
          - estimated_snapshot
          - mixed
          - unknown
          description: Explicit source basis for recognized HPP. Estimated or unknown values cannot be presented
            as finalized actual lot costs.
      required:
      - from
      - to
      - as_of
      - currency
      - gross_merchandise
      - estimated_contribution
      - realized_contribution
      - cash
      - receivables
      - refund_liability
      - affiliate_liability
      - cost_policy_version
      - basis
      - net_merchandise_revenue
      - recognized_hpp
      - gross_merchandise_profit
      - operating_expenses
      - operating_result
      - hpp_basis
      additionalProperties: false
      description: from inclusive/to exclusive period flows; cash, receivables and liabilities are closing
        balances at to, with data freshness as_of. Gross is merchandise before returns, not cash. Estimated
        contribution uses frozen order costs and estimated fees; realized contribution uses posted recognized
        revenue, actual allocated HPP, shipping subsidy, provider/COD fees, packaging, return loss and affiliate
        expense. Cash uses reconciled company cash only, excluding unsettled provider receivables. These are
        contribution figures, not net company profit; tax/overhead completeness must be explicit. Never derive
        cash from gross sales or subtract affiliate expense twice on payout. Net merchandise revenue deducts
        recognized discounts/refunds/returns under the finance policy; gross merchandise profit deducts recognized
        HPP. Operating result deducts recorded operating expenses from contribution and is not finalized net
        profit while taxes or other costs remain incomplete. HPP basis labels actual lot costs versus estimates.
        Inventory acquisition cash outflow is not a second COGS expense; affiliate payout settles its liability
        without recording the same expense again. Expense posting, allocation and period-close controls remain
        T-12 implementation scope; this read contract does not claim a complete ERP.
    ComponentCostVersionInput:
      type: object
      properties:
        unit_cost:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Integer IDR per physical component unit; null is unknown, never an assumed zero.
        source:
          type: string
          minLength: 1
          maxLength: 500
        reason:
          type: string
          minLength: 1
          maxLength: 500
        effective_from:
          $ref: '#/components/schemas/DateTime'
        expected_version:
          type: integer
          minimum: 0
      required:
      - unit_cost
      - source
      - reason
      - effective_from
      - expected_version
      additionalProperties: false
      description: Append-only component HPP version. expected_version=0 means no existing version. Compare-and-append
        atomically; stale version returns 409. Effective timestamp schedules future order costing; no retrospective
        rewriting of posted/snapshotted orders. Unknown costs block complete margin calculations. Corrections
        append a successor; source is a safe reference, never credentials or raw private documents.
    ComponentCostVersion:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        stock_item_id:
          $ref: '#/components/schemas/Id'
        unit_cost:
