          - estimated_contribution
          - realized_contribution
          - net_merchandise_revenue
        count:
          type:
          - integer
          - 'null'
          minimum: 0
        basis:
          type: string
          enum:
          - snapshot
          - event_period
        complete:
          type: boolean
        queue_key:
          type: string
          enum:
          - orders
          - fulfillments
          - delivery_exceptions
          - returns
          - inventory
          - support
          - reconciliation
        kind:
          type: string
          enum:
          - count
          - money
        amount:
          type:
          - integer
          - 'null'
          description: Signed integer IDR for contribution; liability/revenue amounts are nonnegative. Null means
            unknown/incomplete, never inferred zero.
        currency:
          type:
          - string
          - 'null'
          enum:
          - IDR
          - null
        financial_basis:
          type: string
          enum:
          - actual
          - estimated
          - mixed
          - unknown
          - not_applicable
        definition:
          type: string
          minLength: 1
          maxLength: 500
        as_of:
          $ref: '#/components/schemas/DateTime'
        queue_filter_token:
          type: string
          minLength: 16
          maxLength: 2000
        filter_version:
          type: integer
          minimum: 1
        filter_expires_at:
          $ref: '#/components/schemas/DateTime'
        action_href:
          type:
          - string
          - 'null'
          pattern: ^/admin(/[a-z-]+)*$
          maxLength: 200
          description: Existing console screen where staff act on this number; null when the drilldown queue is
            the working screen.
        breakdown:
          type:
          - array
          - 'null'
          maxItems: 100
          items:
            type: object
            properties:
              key:
                type: string
                minLength: 1
                maxLength: 80
              label:
                type: string
                minLength: 1
                maxLength: 200
              count:
                type: integer
                minimum: 0
            required:
            - key
            - label
            - count
            additionalProperties: false
          description: Count split of the same rows (orders by payment channel; low stock per origin warehouse);
            null when the metric has none.
      required:
      - key
      - count
      - basis
      - complete
      - queue_key
      - kind
      - amount
      - currency
      - financial_basis
      - definition
      - as_of
      - queue_filter_token
      - filter_version
      - filter_expires_at
      additionalProperties: false
      description: Typed role-specific KPI. Count and money are different units; money does not overwrite count.
        Explicit definition, basis, freshness/completeness and actor/workspace/warehouse/period-bound drilldown
        token. Unknown required inputs produce null, never fabricated zero; contribution is not net statutory profit.
        Tokens cannot expand scope and are never public URLs.
      allOf:
      - if:
          properties:
            key:
              enum:
              - orders_pending
              - orders_by_payment_method
              - fulfillments_due
              - manual_booking_pending
              - delivery_exceptions
              - returns_pending
              - stock_alerts
              - support_unassigned
              - finance_unmatched
              - transfers_near_deadline
              - autolaris_pending
        then:
          properties:
            kind:
              const: count
            amount:
              type: 'null'
            currency:
              type: 'null'
            financial_basis:
              const: not_applicable
      - if:
          properties:
            key:
              enum:
              - cod_receivable
              - cod_remitted
              - refund_liability
              - affiliate_liability
              - estimated_contribution
              - realized_contribution
              - net_merchandise_revenue
        then:
          properties:
            kind:
              const: money
            count:
              type: 'null'
            currency:
              const: IDR
            financial_basis:
              enum:
              - actual
              - estimated
              - mixed
              - unknown
      - if:
          properties:
            kind:
              const: money
            complete:
              const: true
        then:
          properties:
            amount:
              type: integer
            financial_basis:
              enum:
              - actual
              - estimated
              - mixed
      - if:
          properties:
            kind:
              const: count
            complete:
              const: true
        then:
          properties:
            count:
              type: integer
              minimum: 0
      - if:
          properties:
            kind:
              const: money
            complete:
              const: false
        then:
          properties:
            amount:
              type: 'null'
      - if:
          properties:
            key:
              enum:
              - cod_receivable
              - cod_remitted
              - refund_liability
              - affiliate_liability
              - net_merchandise_revenue
        then:
          properties:
            amount:
              type:
              - integer
              - 'null'
              minimum: 0
    DashboardSnapshot:
      type: object
      properties:
        workspace:
          type: string
