          $ref: '#/components/schemas/Id'
        label:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        price:
          type: integer
          const: 99000
        currency:
          type: string
          const: IDR
        availability:
          type: string
          enum:
          - available
          - unavailable
        image:
          $ref: '#/components/schemas/Image'
        offer_kind:
          type: string
          enum:
          - unit
          - multipack
          - bundle
        contents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/StorefrontContent'
      required:
      - id
      - catalog_id
      - label
      - attributes
      - price
      - currency
      - availability
      - image
      - offer_kind
      - contents
      additionalProperties: false
      description: Selected sellable option costs exactly IDR99000 for all included components, not per component.
        Unit has one component of quantity1; multipack has one component with quantity>=2; bundle has at least two
        distinct inventory components. Publication validates these rules, physical attributes, stock and category-required
        facts. Every component must be reservable atomically from one warehouse for the full selected quantity;
        do not split one offer across warehouses.
      allOf:
      - if:
          properties:
            offer_kind:
              const: unit
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    const: 1
      - if:
          properties:
            offer_kind:
              const: multipack
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    minimum: 2
      - if:
          properties:
            offer_kind:
              const: bundle
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 2
