      - warehouse_name
      - version
      - readiness
      - mode
      - mengantar_api_enabled
      - street_address
      - pic_name
      - pic_phone
      - pinpoint
      - updated_at
      additionalProperties: false
      description: 'Private personal data (owner/ecommerce_admin only): never in public, buyer, export, log or audit-detail
        payloads. Mode is mengantar_api only when readiness is complete and the Mengantar API flag is on (off until
        S94).'
    PickupProfileInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 0
        street_address:
          type:
          - string
          - 'null'
          minLength: 10
          maxLength: 300
        pic_name:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 120
        pic_phone:
          type:
          - string
          - 'null'
          maxLength: 24
        pinpoint:
          anyOf:
          - type: object
            properties:
              latitude:
                type: number
                minimum: -11
                maximum: 6
              longitude:
                type: number
                minimum: 95
                maximum: 141
            required:
            - latitude
            - longitude
            additionalProperties: false
          - type: 'null'
        reason:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - expected_version
      - reason
      additionalProperties: false
    CodRemittance:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        reference:
          type: string
        statement_at:
          $ref: '#/components/schemas/DateTime'
        currency:
          type: string
          enum:
          - IDR
        gross_amount:
          $ref: '#/components/schemas/Money'
        shipping_deduction:
          $ref: '#/components/schemas/Money'
        cod_fee_deduction:
          $ref: '#/components/schemas/Money'
        other_deduction:
          $ref: '#/components/schemas/Money'
        net_amount:
          $ref: '#/components/schemas/Money'
        expected_net_amount:
          type: integer
        evidence:
          type: string
        flags:
          type: array
          items:
            type: string
            enum:
            - PARCEL_AMOUNT_MISMATCH
            - STATEMENT_TOTAL_MISMATCH
            - OTHER_DEDUCTION_REVIEW
            - NET_BELOW_EXPECTED
            - COLLECTION_CALLBACK_FAILED
            - COLLECTION_MATCH_FAILED
        settlement:
          anyOf:
          - type: object
            properties:
              id:
                $ref: '#/components/schemas/Id'
              status:
                type: string
              problem_code:
                type:
                - string
                - 'null'
            required:
            - id
            - status
            - problem_code
            additionalProperties: false
          - type: 'null'
        lines:
          type: array
          items:
            type: object
            properties:
              shipment_id:
                $ref: '#/components/schemas/Id'
              order_number:
                type: string
              amount:
                $ref: '#/components/schemas/Money'
              expected_amount:
                $ref: '#/components/schemas/Money'
              collection_status:
                type: string
                enum:
                - pending
                - collected
                - recovery
                - duplicate
                - refused
              collection_reason:
                type:
                - string
                - 'null'
            required:
            - shipment_id
            - order_number
            - amount
            - expected_amount
            - collection_status
            - collection_reason
            additionalProperties: false
          maxItems: 100
        recorded_at:
          $ref: '#/components/schemas/DateTime'
      required:
      - id
      - reference
      - statement_at
      - currency
      - gross_amount
      - shipping_deduction
      - cod_fee_deduction
      - other_deduction
      - net_amount
      - expected_net_amount
      - evidence
      - flags
      - settlement
      - lines
      - recorded_at
      additionalProperties: false
      description: Finance-recorded Mengantar COD settlement statement (DEC-007). Collections and cash post only through
        the existing COD receipt and settlement journals; mismatches are flagged, never silently accepted. No seller
        payable.
    CodRemittanceList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CodRemittance'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
      additionalProperties: false
    CodRemittanceInput:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        reference:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{2,79}$
        statement_at:
          $ref: '#/components/schemas/DateTime'
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            properties:
              shipment_id:
                $ref: '#/components/schemas/Id'
              amount:
                type: integer
                minimum: 1
            required:
            - shipment_id
            - amount
            additionalProperties: false
        shipping_deduction:
          type: integer
          minimum: 0
        cod_fee_deduction:
          type: integer
          minimum: 0
        other_deduction:
          type: integer
          minimum: 0
        net_amount:
          type: integer
          minimum: 0
        evidence:
          type: string
          minLength: 1
          maxLength: 500
        reason:
          type: string
          minLength: 1
          maxLength: 200
        reauthentication_proof:
          type: string
          minLength: 1
          maxLength: 100
          description: finance.reconcile proof bound to this statement id.
      required:
      - id
      - reference
      - statement_at
      - lines
      - shipping_deduction
      - cod_fee_deduction
      - other_deduction
      - net_amount
      - evidence
      - reason
      - reauthentication_proof
      additionalProperties: false
    CodCollectibleParcelList:
      type: object
      properties:
        data:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              shipment_id:
                $ref: '#/components/schemas/Id'
              order_number:
                type: string
              cod_due:
                allOf:
                - $ref: '#/components/schemas/Money'
                description: Current COD collection basis (surviving units incl. their COD fee shares), the amount a
                  statement line is checked against; below order_shipment.cod_due after a unit cancellation.
              handed_over_at:
                $ref: '#/components/schemas/DateTime'
              courier:
                type:
                - string
                - 'null'
              tracking_number:
                type:
                - string
                - 'null'
            required:
            - shipment_id
            - order_number
            - cod_due
            - handed_over_at
            - courier
            - tracking_number
            additionalProperties: false
      required:
      - data
      additionalProperties: false
    CodCollections:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - confirmed_at
      - currency
      - buyer_total
      - collected_total
      - merchandise_collected
      - parcels
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 2
        confirmed_at:
          $ref: '#/components/schemas/DateTime'
        currency:
          type: string
          const: IDR
        buyer_total:
          $ref: '#/components/schemas/Money'
        collected_total:
          $ref: '#/components/schemas/Money'
        merchandise_collected:
          $ref: '#/components/schemas/Money'
        parcels:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CodCollectionParcel'
    CodCollectionParcel:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - amount_due
      - merchandise_amount
      - buyer_shipping_amount
      - collected_at
      - receipt_id
      properties:
        cod_fee_amount:
          $ref: '#/components/schemas/Money'
          description: DEC-009 buyer-paid COD fee in this parcel amount.
        id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - due
          - collected
          - refused
          - reconciliation
          - cancelled
        amount_due:
          $ref: '#/components/schemas/Money'
        merchandise_amount:
          $ref: '#/components/schemas/Money'
        buyer_shipping_amount:
          $ref: '#/components/schemas/Money'
        collected_at:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        receipt_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      allOf:
      - if:
          properties:
            status:
              enum:
              - due
              - collected
              - refused
        then:
          properties:
            amount_due:
              minimum: 1
            merchandise_amount:
              minimum: 1
      - if:
          properties:
            status:
              const: cancelled
        then:
          properties:
            amount_due:
              const: 0
            merchandise_amount:
              const: 0
            buyer_shipping_amount:
              const: 0
            collected_at:
              type: 'null'
            receipt_id:
              type: 'null'
      description: Before funding, amounts follow the currently collectible original units. After an accepted collection,
        they retain the original receipt's frozen amounts. A fully retired unpaid parcel has zero amounts and cancelled
        status; unresolved original money can still require reconciliation. buyer_total on CodCollections remains
        the original order snapshot. New S33 cancellation branches await runtime proof.
    Id:
      type: string
      minLength: 1
      maxLength: 100
      description: Opaque immutable ID, serialized as a string; never coerce to number or derive from mutable slug.
    DateTime:
      type: string
      format: date-time
      description: RFC 3339 timestamp with explicit timezone; persistence uses UTC.
    Money:
      type: integer
      minimum: 0
      description: Exact integer Indonesian rupiah (IDR), not a formatted display string.
    Pagination:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - next_cursor
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        request_id:
          $ref: '#/components/schemas/Id'
        field_errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
            required:
            - field
            - code
            - message
            additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      additionalProperties: false
      description: RFC 9457 problem; no secrets or unnecessary personal information in errors.
    Image:
      type: object
      properties:
        url:
          type: string
          format: uri
        alt:
          type: string
          minLength: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
      required:
      - url
      - alt
      - width
      - height
      additionalProperties: false
    Category:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        slug:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        image:
          $ref: '#/components/schemas/Image'
      required:
      - id
      - name
      - slug
      - parent_id
      additionalProperties: false
    Attribute:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        values:
          type: array
          items:
            type: string
      required:
      - key
      - label
      - values
      additionalProperties: false
    Variant:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        catalog_id:
          $ref: '#/components/schemas/Id'
        sku:
          type: string
        label:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        price:
          type: integer
          const: 99000
        currency:
          type: string
          const: IDR
        availability:
          type: string
          enum:
          - available
          - unavailable
        image:
          $ref: '#/components/schemas/Image'
        offer_kind:
          type: string
          enum:
          - unit
          - multipack
          - bundle
        contents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OfferContent'
      required:
      - id
      - catalog_id
      - sku
      - label
      - attributes
      - price
      - currency
      - availability
      - image
      - offer_kind
      - contents
      additionalProperties: false
      description: Selected sellable option costs exactly IDR99000 for all included components, not per component.
        Unit has one component of quantity1; multipack has one component with quantity>=2; bundle has at least two
        distinct inventory components. Publication validates these rules, physical attributes, stock and category-required
        facts. Every component must be reservable atomically from one warehouse for the full selected quantity;
        do not split one offer across warehouses.
      allOf:
      - if:
          properties:
            offer_kind:
              const: unit
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    const: 1
      - if:
          properties:
            offer_kind:
              const: multipack
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    minimum: 2
      - if:
          properties:
            offer_kind:
              const: bundle
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 2
    Product:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        catalog_id:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
        name:
          type: string
        category_id:
          $ref: '#/components/schemas/Id'
        description:
          type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
          minItems: 1
        facts:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        version:
          type: integer
          minimum: 1
          readOnly: true
          description: 'Version of this server projection: draft revision on authorized admin editing, immutable
            published revision on public catalog. Use admin draft version for optimistic updates/publication.'
      required:
      - id
      - catalog_id
      - slug
      - name
      - category_id
      - description
      - images
      - variants
      - facts
      - version
      additionalProperties: false
      description: One listing may mix unit, multipack and bundle variants. Buyer selects one variant; quantity1
        adds that complete offer once at IDR99000. Show selected contents with quantities and one total; choosing
        a second variant creates another separately priced cart line. Response version exposes current draft revision
        for admin edit recovery; public catalog returns its published snapshot, never unpublished edits. Server-generated
        product/variant/catalog IDs remain stable and are never recycled.
    CategoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
      additionalProperties: false
    ProductList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'
        available_filters:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
      required:
      - data
      - pagination
      - available_filters
      additionalProperties: false
    Address:
      type: object
      properties:
        recipient_name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          minLength: 8
          maxLength: 30
        address_line:
          type: string
          minLength: 1
          maxLength: 500
        destination_id:
          $ref: '#/components/schemas/Id'
        postal_code:
          type: string
          maxLength: 20
      required:
      - recipient_name
      - phone
      - address_line
      - destination_id
      - postal_code
      additionalProperties: false
      description: Destination identity comes from server area lookup. No client-asserted shipping price.
    Destination:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        postal_code:
          type: string
        subdistrict:
          type: string
      required:
      - id
      - label
      - province
      - city
      - district
      additionalProperties: false
    DestinationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Destination'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
      additionalProperties: false
    CartLineInput:
      type: object
      properties:
        variant_id:
          $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          minimum: 1
          maximum: 50
        expected_publication_id:
          $ref: '#/components/schemas/Id'
      required:
      - variant_id
      - quantity
      - expected_publication_id
      additionalProperties: false
      description: Server may enforce lower stock/risk limits; quantity does not imply available inventory.
    CartLine:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        product_id:
          $ref: '#/components/schemas/Id'
        catalog_id:
          $ref: '#/components/schemas/Id'
        variant_id:
          $ref: '#/components/schemas/Id'
        publication_id:
          $ref: '#/components/schemas/Id'
        product_revision:
          type: integer
          minimum: 1
        name:
          type: string
        variant_label:
          type: string
        offer_kind:
          type: string
          enum:
          - unit
          - multipack
          - bundle
        contents:
          type: array
          items:
            $ref: '#/components/schemas/OfferContent'
          minItems: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 50
        unit_price:
          type: integer
          const: 99000
        line_total:
          $ref: '#/components/schemas/Money'
        publication_changed:
          type: boolean
      required:
      - id
      - product_id
      - catalog_id
      - variant_id
      - publication_id
      - product_revision
      - name
      - variant_label
      - offer_kind
      - contents
      - quantity
      - unit_price
      - line_total
      - publication_changed
      additionalProperties: false
    CartCreate:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLineInput'
          maxItems: 50
        access_transport:
          type: string
          enum:
          - browser
          - header
          default: browser
      required: []
      additionalProperties: false
    Cart:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
        currency:
          type: string
          const: IDR
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        merchandise_total:
          $ref: '#/components/schemas/Money'
        expires_at:
          $ref: '#/components/schemas/DateTime'
        state:
          type: string
          enum:
          - open
          - submitted
        access_transport:
          type: string
          enum:
          - browser
          - header
        active_quote_id: &id006
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 100
        submitted_order_id: *id006
      required:
      - id
      - version
      - currency
      - lines
      - merchandise_total
      - expires_at
      - state
      - access_transport
      - active_quote_id
      - submitted_order_id
      additionalProperties: false
    CartCreated:
      type: object
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        cart_access_token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Only explicit header-mode creation/recovery; omitted from browser responses.
      required:
      - cart
      additionalProperties: false
      description: Owned cart plus optional header-mode cart credential; browser transport uses HttpOnly cookie
        delivery.
    CartLineUpdate:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 50
        expected_version:
          type: integer
          minimum: 1
        expected_publication_id:
          $ref: '#/components/schemas/Id'
      required:
      - quantity
      - expected_version
      additionalProperties: false
    QuoteInput:
      type: object
      properties:
        payment_channel:
          type: string
          enum:
          - local-prepaid
          - manual-bank
          - autolaris
          - cod
          description: DEC-008 channel; defaults to local-prepaid for prepaid and cod for COD. manual-bank requires owner-configured
            transfer accounts.
        cart_id:
          $ref: '#/components/schemas/Id'
        address:
          $ref: '#/components/schemas/Address'
        payment_method:
          type: string
          enum:
          - prepaid
          - cod
        contact:
          $ref: '#/components/schemas/CheckoutContact'
      required:
      - cart_id
      - address
      - payment_method
      - contact
      additionalProperties: false
    ShippingOption:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        courier_name:
          type: string
        service_name:
          type: string
        shipping_amount:
          $ref: '#/components/schemas/Money'
        supports_cod:
          type: boolean
        estimated_delivery_start:
          $ref: '#/components/schemas/DateTime'
        estimated_delivery_end:
          $ref: '#/components/schemas/DateTime'
        source:
          type: string
          minLength: 1
        expires_at:
          $ref: '#/components/schemas/DateTime'
      required:
      - id
      - courier_name
      - service_name
      - shipping_amount
      - supports_cod
      additionalProperties: false
    PackageLine:
      type: object
      properties:
        cart_line_id:
          $ref: '#/components/schemas/Id'
        variant_id:
          $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          minimum: 1
      required:
      - cart_line_id
      - variant_id
      - quantity
      additionalProperties: false
    QuotedPackage:
      type: object
      properties:
        cod_fee_amount:
          $ref: '#/components/schemas/Money'
          description: DEC-009 per-parcel ceil((merchandise + buyer shipping) x cod_fee_bps / 10000).
        id:
          $ref: '#/components/schemas/Id'
        origin_city:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PackageLine'
        options:
          type: array
          items:
            $ref: '#/components/schemas/ShippingOption'
          minItems: 1
        selected_option_id:
          $ref: '#/components/schemas/Id'
        merchandise_amount:
          $ref: '#/components/schemas/Money'
        shipping_amount:
          $ref: '#/components/schemas/Money'
        subsidy_amount:
          $ref: '#/components/schemas/Money'
        buyer_shipping_amount:
          $ref: '#/components/schemas/Money'
        cod_collect_amount:
          $ref: '#/components/schemas/Money'
      required:
      - id
      - origin_city
      - lines
      - options
      - selected_option_id
      - merchandise_amount
      - shipping_amount
      - subsidy_amount
      - buyer_shipping_amount
      additionalProperties: false
    Quote:
      type: object
      properties:
        payment_channel:
          type: string
          enum:
          - local-prepaid
          - manual-bank
          - autolaris
          - cod
        cod_fee_bps:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 2000
        cod_fee_total:
          $ref: '#/components/schemas/Money'
        amount_due:
          $ref: '#/components/schemas/Money'
          description: buyer_total + buyer-paid payment charge (COD fee).
        id:
          $ref: '#/components/schemas/Id'
        cart_id:
          $ref: '#/components/schemas/Id'
        cart_version:
          type: integer
          minimum: 1
        expires_at:
          $ref: '#/components/schemas/DateTime'
        payment_method:
          type: string
          enum:
          - prepaid
          - cod
        packages:
          type: array
          items:
            $ref: '#/components/schemas/QuotedPackage'
          minItems: 1
