      description: Buyer address, totals, method and package choices resolve from quote; clients cannot set rates,
        affiliate owner, receipt timestamps or eligibility.
    OrderItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        variant_id:
          $ref: '#/components/schemas/Id'
        catalog_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: integer
          const: 99000
          readOnly: true
        subtotal:
          $ref: '#/components/schemas/Money'
        returned_quantity:
          type: integer
          minimum: 0
          description: Distinct original offer units with recorded physical claim intake. This does not prove SKU
            identity, complete contents, sellable stock or a cash refund.
        cancelled_quantity:
          type: integer
          minimum: 0
          readOnly: true
          description: Original complete purchased units explicitly retired by an accepted scoped remedy. Original
            quantity, subtotal and contents remain immutable; this count establishes no refund or physical return.
        variant_label:
          type: string
          minLength: 1
          maxLength: 200
        offer_kind:
          type: string
          enum:
          - unit
          - multipack
          - bundle
        contents:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OfferContent'
          readOnly: true
          description: Immutable purchased contents per complete offer unit at order creation, including original
            component names/identities and included quantities. Multiply by OrderItem.quantity for physical piece
            demand; never bill contents as additional offers or resolve from mutable catalog.
        received_quantity:
          type: integer
          minimum: 0
          readOnly: true
          description: Original offer units with immutable actual buyer receipt.
        refunded_quantity:
          type: integer
          minimum: 0
          readOnly: true
          description: Original offer units included in authenticated successful outgoing cash refunds.
        return_pending_quantity:
          type: integer
          minimum: 0
          readOnly: true
          description: Original offer units with a held or replacing claim.
      required:
      - id
      - variant_id
      - catalog_id
      - name
      - quantity
      - unit_price
      - subtotal
      - returned_quantity
      - variant_label
      - offer_kind
      - contents
      additionalProperties: false
      description: Immutable purchased option/name/contents/quantity/price snapshot; selected offer kind and variant
        label come from the committed order, not current product/variant records. Contents are per offer unit, while
        quantity counts complete IDR99000 offers. Later catalog edits and address-book updates cannot change this
        response history. Subtotal remains server-derived and conserved with original order amounts.
      allOf:
      - if:
          properties:
            offer_kind:
              const: unit
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    const: 1
      - if:
          properties:
            offer_kind:
              const: multipack
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    minimum: 2
      - if:
          properties:
            offer_kind:
              const: bundle
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 2
