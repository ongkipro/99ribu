      - as_of
      - metrics
      additionalProperties: false
      description: Role-specific allowlisted metrics; scope/period/time basis matches drill-through. Missing role
        data denied/omitted, never borrowed from broad company view. Owner workspace requires owner; finance metrics
        require finance permission. Money metrics only owner/explicit finance workspace with finance.summary.read;
        no company money metric through warehouse/ecommerce/CS workspace. Each queue filter token freezes the exact
        metric definition/scope/period/time basis/as-of and expires; counts match that authorized queue snapshot.
      allOf:
      - if:
          properties:
            workspace:
              const: warehouse
        then:
          properties:
            metrics:
              items:
                properties:
                  key:
                    enum:
                    - fulfillments_due
                    - manual_booking_pending
                    - delivery_exceptions
                    - returns_pending
                    - stock_alerts
      - if:
          properties:
            workspace:
              const: customer_service
        then:
          properties:
            metrics:
              items:
                properties:
                  key:
                    enum:
                    - orders_pending
                    - delivery_exceptions
                    - returns_pending
                    - support_unassigned
      - if:
          properties:
            workspace:
              const: ecommerce_admin
        then:
          properties:
            metrics:
              items:
                properties:
                  key:
                    enum:
                    - orders_pending
                    - orders_by_payment_method
                    - fulfillments_due
                    - manual_booking_pending
                    - delivery_exceptions
                    - returns_pending
                    - stock_alerts
      - if:
          properties:
            workspace:
              const: finance
        then:
          properties:
            metrics:
              items:
                properties:
                  key:
                    enum:
                    - finance_unmatched
                    - orders_by_payment_method
                    - transfers_near_deadline
                    - autolaris_pending
                    - cod_receivable
                    - cod_remitted
                    - refund_liability
                    - affiliate_liability
                    - estimated_contribution
                    - realized_contribution
                    - net_merchandise_revenue
