        filter_expires_at:
          $ref: '#/components/schemas/DateTime'
      required:
      - key
      - count
      - basis
      - complete
      - queue_key
      - kind
      - amount
      - currency
      - financial_basis
      - definition
      - as_of
      - queue_filter_token
      - filter_version
      - filter_expires_at
      additionalProperties: false
      description: Typed role-specific KPI. Count and money are different units; money does not overwrite
        count. Explicit definition, basis, freshness/completeness and actor/workspace/warehouse/period-bound
        drilldown token. Unknown required inputs produce null, never fabricated zero; contribution is not
        net statutory profit. Tokens cannot expand scope and are never public URLs.
      allOf:
      - if:
          properties:
            key:
              enum:
              - orders_pending
              - fulfillments_due
              - delivery_exceptions
              - returns_pending
              - stock_alerts
              - support_unassigned
              - finance_unmatched
        then:
          properties:
            kind:
              const: count
            amount:
              type: 'null'
            currency:
              type: 'null'
            financial_basis:
              const: not_applicable
      - if:
          properties:
            key:
              enum:
              - cod_receivable
              - refund_liability
              - affiliate_liability
              - estimated_contribution
              - realized_contribution
              - net_merchandise_revenue
        then:
          properties:
            kind:
              const: money
            count:
              type: 'null'
            currency:
              const: IDR
            financial_basis:
              enum:
              - actual
              - estimated
              - mixed
              - unknown
      - if:
          properties:
            kind:
              const: money
            complete:
              const: true
        then:
          properties:
            amount:
              type: integer
            financial_basis:
              enum:
              - actual
              - estimated
              - mixed
      - if:
          properties:
            kind:
              const: count
            complete:
              const: true
        then:
          properties:
            count:
              type: integer
              minimum: 0
      - if:
          properties:
            kind:
              const: money
            complete:
              const: false
        then:
          properties:
            amount:
              type: 'null'
      - if:
          properties:
            key:
              enum:
              - cod_receivable
              - refund_liability
              - affiliate_liability
              - net_merchandise_revenue
        then:
          properties:
            amount:
              type:
              - integer
              - 'null'
              minimum: 0
