          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected server/proxy failure; clients tolerate a non-Problem gateway body. Financial
            result may be unknown; recover the operation before retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportConversationList'
          headers:
            Cache-Control:
              description: Private response; never shared cached.
              schema:
                type: string
                const: no-store
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportConversationSearchInput'
  /support/contact-challenges:
    post:
      operationId: requestSupportRecoveryContactBinding
      summary: Request support recovery contact binding
      description: Optional current-support-identity recovery contact enrollment; no signup/email required.
        Generic actor-bound challenge, short-lived single-use supported verification, rate/attempt limits
        and audit. Initial binding compares version0; contact replacement compares current version and original-identity
        reauthentication. Never merge accounts/old threads from matching contact text, contact possession
        alone or a conversation number. Successful verification enables later reviewed lost-session recovery
        for this exact original identity; no order access. Secure cookies, CSRF/origin, no-store, secret
        proof redaction and purpose-bound retention apply. Exact challenge delivery method remains selected-auth
        gate.
      tags:
      - Support
      security:
      - sessionCookie: []
      - bearerAuth: []
      - supportSession: []
      x-contract-status: proposal
      x-primary-requirement: PR-22
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected server/proxy failure; clients tolerate a non-Problem gateway body. Financial
            result may be unknown; recover the operation before retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
          headers:
            Cache-Control:
              description: Private response; never shared cached.
              schema:
                type: string
                const: no-store
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportContactBindingInput'
  /support/contact-challenges/{challengeId}/verifications:
    post:
      operationId: verifySupportRecoveryContactBinding
      summary: Verify support recovery contact binding
      description: Optional current-support-identity recovery contact enrollment; no signup/email required.
        Generic actor-bound challenge, short-lived single-use supported verification, rate/attempt limits
        and audit. Initial binding compares version0; contact replacement compares current version and original-identity
        reauthentication. Never merge accounts/old threads from matching contact text, contact possession
        alone or a conversation number. Successful verification enables later reviewed lost-session recovery
        for this exact original identity; no order access. Secure cookies, CSRF/origin, no-store, secret
        proof redaction and purpose-bound retention apply. Exact challenge delivery method remains selected-auth
        gate.
      tags:
      - Support
      security:
      - sessionCookie: []
      - bearerAuth: []
      - supportSession: []
      x-contract-status: proposal
      x-primary-requirement: PR-22
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          description: Unexpected server/proxy failure; clients tolerate a non-Problem gateway body. Financial
            result may be unknown; recover the operation before retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAcknowledgement'
          headers:
            Cache-Control:
              description: Private response; never shared cached.
              schema:
                type: string
                const: no-store
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: challengeId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopedChallengeVerifyInput'
components:
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 100
      description: Opaque immutable ID, serialized as a string; never coerce to number
        or derive from mutable slug.
    DateTime:
      type: string
      format: date-time
      description: RFC 3339 timestamp with explicit timezone; persistence uses UTC.
    Money:
      type: integer
      minimum: 0
      description: Exact integer Indonesian rupiah (IDR), not a formatted display
        string.
    Pagination:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - next_cursor
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        request_id:
          $ref: '#/components/schemas/Id'
        field_errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
            required:
            - field
            - code
            - message
            additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      additionalProperties: false
      description: RFC 9457 problem; no secrets or unnecessary personal information
        in errors.
    Image:
      type: object
      properties:
        url:
          type: string
          format: uri
        alt:
          type: string
          minLength: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
      required:
      - url
      - alt
      - width
      - height
      additionalProperties: false
    Category:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        slug:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        image:
          $ref: '#/components/schemas/Image'
      required:
      - id
      - name
      - slug
      - parent_id
      additionalProperties: false
    Attribute:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        values:
          type: array
          items:
            type: string
      required:
      - key
      - label
      - values
      additionalProperties: false
    Variant:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        catalog_id:
          $ref: '#/components/schemas/Id'
        sku:
          type: string
        label:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        price:
          type: integer
          const: 99000
        currency:
          type: string
          const: IDR
        availability:
          type: string
          enum:
          - available
          - unavailable
        image:
          $ref: '#/components/schemas/Image'
        offer_kind:
          type: string
          enum:
          - unit
          - multipack
          - bundle
        contents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OfferContent'
      required:
      - id
      - catalog_id
      - sku
      - label
      - attributes
      - price
      - currency
      - availability
      - image
      - offer_kind
      - contents
      additionalProperties: false
      description: Selected sellable option costs exactly IDR99000 for all included components, not per component.
        Unit has one component of quantity1; multipack has one component with quantity>=2; bundle has at least
        two distinct inventory components. Publication validates these rules, physical attributes, stock and
        category-required facts. Every component must be reservable atomically from one warehouse for the
        full selected quantity; do not split one offer across warehouses.
      allOf:
      - if:
          properties:
            offer_kind:
              const: unit
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    const: 1
      - if:
          properties:
            offer_kind:
              const: multipack
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    minimum: 2
      - if:
          properties:
            offer_kind:
              const: bundle
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 2
    Product:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        catalog_id:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
        name:
          type: string
        category_id:
          $ref: '#/components/schemas/Id'
        description:
          type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
          minItems: 1
        facts:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        version:
          type: integer
          minimum: 1
          readOnly: true
          description: 'Version of this server projection: draft revision on authorized admin editing, immutable
            published revision on public catalog. Use admin draft version for optimistic updates/publication.'
      required:
      - id
      - catalog_id
      - slug
      - name
      - category_id
      - description
      - images
      - variants
      - facts
      - version
      additionalProperties: false
      description: One listing may mix unit, multipack and bundle variants. Buyer selects one variant; quantity1
        adds that complete offer once at IDR99000. Show selected contents with quantities and one total; choosing
        a second variant creates another separately priced cart line. Response version exposes current draft
        revision for admin edit recovery; public catalog returns its published snapshot, never unpublished
        edits. Server-generated product/variant/catalog IDs remain stable and are never recycled.
    CategoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
      additionalProperties: false
    ProductList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'
        available_filters:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
      required:
      - data
      - pagination
      - available_filters
      additionalProperties: false
    Address:
      type: object
      properties:
        recipient_name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          minLength: 8
          maxLength: 30
        address_line:
          type: string
          minLength: 1
          maxLength: 500
        destination_id:
          $ref: '#/components/schemas/Id'
        postal_code:
          type: string
          maxLength: 20
      required:
      - recipient_name
      - phone
      - address_line
      - destination_id
      - postal_code
      additionalProperties: false
      description: Destination identity comes from server area lookup. No client-asserted
        shipping price.
    Destination:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        province:
          type: string
        city:
          type: string
        district:
          type: string
        postal_code:
          type: string
      required:
      - id
      - label
      - province
      - city
      - district
      additionalProperties: false
    DestinationList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Destination'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
      additionalProperties: false
    CartLineInput:
      type: object
      properties:
        variant_id:
          $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          minimum: 1
      required:
      - variant_id
      - quantity
      additionalProperties: false
      description: Server may enforce lower stock/risk limits; quantity does not imply
        available inventory.
    CartLine:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        variant_id:
          $ref: '#/components/schemas/Id'
        catalog_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: '#/components/schemas/Money'
        subtotal:
          $ref: '#/components/schemas/Money'
        availability:
          type: string
          enum:
          - available
          - insufficient_stock
          - unavailable
      required:
      - id
      - variant_id
      - catalog_id
      - name
      - quantity
      - unit_price
      - subtotal
      - availability
      additionalProperties: false
    CartCreate:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLineInput'
      required: []
      additionalProperties: false
    Cart:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
        currency:
          type: string
          const: IDR
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        merchandise_total:
          $ref: '#/components/schemas/Money'
        expires_at:
          $ref: '#/components/schemas/DateTime'
      required:
      - id
      - version
      - currency
      - lines
      - merchandise_total
      - expires_at
      additionalProperties: false
    CartCreated:
      type: object
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        cart_access_token:
          type: string
          minLength: 32
          description: Write-only delivery of short-lived cart-scoped capability.
            Exclude from logs and URLs; treat as credential, never order access.
      required:
      - cart
      - cart_access_token
      additionalProperties: false
      description: Draft browser transport may use an HttpOnly scoped cookie/BFF instead
        of exposing this value to JavaScript; final IAM choice is gated.
    CartLineUpdate:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
        expected_version:
          type: integer
          minimum: 1
      required:
      - quantity
      - expected_version
      additionalProperties: false
    QuoteInput:
      type: object
      properties:
        cart_id:
          $ref: '#/components/schemas/Id'
        address:
          $ref: '#/components/schemas/Address'
        payment_method:
          type: string
          enum:
          - prepaid
          - cod
      required:
      - cart_id
      - address
      - payment_method
      additionalProperties: false
    ShippingOption:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        courier_name:
          type: string
        service_name:
          type: string
        shipping_amount:
          $ref: '#/components/schemas/Money'
        supports_cod:
          type: boolean
        estimated_delivery_start:
          $ref: '#/components/schemas/DateTime'
        estimated_delivery_end:
          $ref: '#/components/schemas/DateTime'
      required:
      - id
      - courier_name
      - service_name
      - shipping_amount
      - supports_cod
      additionalProperties: false
    PackageLine:
      type: object
      properties:
        cart_line_id:
          $ref: '#/components/schemas/Id'
        variant_id:
          $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          minimum: 1
      required:
      - cart_line_id
      - variant_id
      - quantity
      additionalProperties: false
    QuotedPackage:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        origin_city:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PackageLine'
        options:
          type: array
          items:
            $ref: '#/components/schemas/ShippingOption'
          minItems: 1
        selected_option_id:
          $ref: '#/components/schemas/Id'
        merchandise_amount:
          $ref: '#/components/schemas/Money'
        shipping_amount:
          $ref: '#/components/schemas/Money'
        subsidy_amount:
          $ref: '#/components/schemas/Money'
        buyer_shipping_amount:
          $ref: '#/components/schemas/Money'
        cod_collect_amount:
          $ref: '#/components/schemas/Money'
      required:
      - id
      - origin_city
      - lines
      - options
      - selected_option_id
      - merchandise_amount
      - shipping_amount
      - subsidy_amount
      - buyer_shipping_amount
      additionalProperties: false
    Quote:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        cart_id:
          $ref: '#/components/schemas/Id'
        cart_version:
          type: integer
          minimum: 1
        expires_at:
          $ref: '#/components/schemas/DateTime'
        payment_method:
          type: string
          enum:
          - prepaid
          - cod
        packages:
          type: array
          items:
            $ref: '#/components/schemas/QuotedPackage'
          minItems: 1
        merchandise_total:
          $ref: '#/components/schemas/Money'
        shipping_total:
          $ref: '#/components/schemas/Money'
        subsidy_total:
          $ref: '#/components/schemas/Money'
        buyer_total:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          const: IDR
        available_payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
      required:
      - id
      - cart_id
      - cart_version
      - expires_at
      - payment_method
      - packages
      - merchandise_total
      - shipping_total
      - subsidy_total
      - buyer_total
      - currency
      - available_payment_methods
      additionalProperties: false
      description: Server-authoritative frozen proposal; payment/stock/promo validated
        again on order creation. COD collection amounts sum to buyer_total. Every
        selected_option_id must belong to its package options, support the selected
        method, and remain valid at order creation. Packages are nonempty. COD package
        collection amounts are required and sum exactly to buyer_total; JSON Schema
        cannot enforce cross-object arithmetic, so domain tests must.
      allOf:
      - if:
          properties:
            payment_method:
              const: cod
          required:
          - payment_method
        then:
          properties:
            packages:
              items:
                required:
                - cod_collect_amount
                properties:
                  cod_collect_amount:
                    $ref: '#/components/schemas/Money'
    QuoteSelection:
      type: object
      properties:
        packages:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              package_id:
                $ref: '#/components/schemas/Id'
              shipping_option_id:
                $ref: '#/components/schemas/Id'
            required:
            - package_id
            - shipping_option_id
            additionalProperties: false
      required:
      - packages
      additionalProperties: false
    OrderCreate:
      type: object
      properties:
        quote_id:
          $ref: '#/components/schemas/Id'
        buyer_note:
          type: string
          maxLength: 1000
      required:
      - quote_id
      additionalProperties: false
      description: Buyer address, totals, method and package choices resolve from
        quote; clients cannot set rates, affiliate owner, receipt timestamps or eligibility.
    OrderItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        variant_id:
          $ref: '#/components/schemas/Id'
        catalog_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: integer
          const: 99000
          readOnly: true
        subtotal:
          $ref: '#/components/schemas/Money'
        returned_quantity:
          type: integer
          minimum: 0
        variant_label:
          type: string
          minLength: 1
          maxLength: 200
        offer_kind:
          type: string
          enum:
          - unit
          - multipack
          - bundle
        contents:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OfferContent'
          readOnly: true
          description: Immutable purchased contents per complete offer unit at order creation, including original
            component names/identities and included quantities. Multiply by OrderItem.quantity for physical
            piece demand; never bill contents as additional offers or resolve from mutable catalog.
      required:
      - id
      - variant_id
      - catalog_id
      - name
      - quantity
      - unit_price
      - subtotal
      - returned_quantity
      - variant_label
      - offer_kind
      - contents
      additionalProperties: false
      description: Immutable purchased option/name/contents/quantity/price snapshot; selected offer kind and
        variant label come from the committed order, not current product/variant records. Contents are per
        offer unit, while quantity counts complete IDR99000 offers. Later catalog edits and address-book updates
        cannot change this response history. Subtotal remains server-derived and conserved with original order
        amounts.
      allOf:
      - if:
          properties:
            offer_kind:
              const: unit
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    const: 1
      - if:
          properties:
            offer_kind:
              const: multipack
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    minimum: 2
      - if:
          properties:
            offer_kind:
              const: bundle
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 2
    ShipmentLine:
      type: object
      properties:
        order_item_id:
          $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          minimum: 1
        fulfillment_item_id:
          $ref: '#/components/schemas/Id'
        replacement_of_fulfillment_item_id:
          $ref: '#/components/schemas/Id'
      required:
      - order_item_id
      - quantity
      - fulfillment_item_id
      additionalProperties: false
    Shipment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        origin_city:
          type: string
        status:
          type: string
          enum:
          - unbooked
          - booked
          - packed
          - handed_over
          - in_transit
          - delivered
          - failed
          - returned
          - cancelled
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentLine'
        courier_name:
          type: string
        service_name:
          type: string
        tracking_number:
          type: string
        buyer_shipping_amount:
          $ref: '#/components/schemas/Money'
        cod_collect_amount:
          $ref: '#/components/schemas/Money'
        delivered_at:
          $ref: '#/components/schemas/DateTime'
        estimated_delivery_start:
          $ref: '#/components/schemas/DateTime'
        estimated_delivery_end:
          $ref: '#/components/schemas/DateTime'
        kind:
          type: string
          enum:
          - original
          - replacement
        waybill_issued_at:
          $ref: '#/components/schemas/DateTime'
      required:
      - id
      - origin_city
      - status
      - items
      - buyer_shipping_amount
      - kind
      additionalProperties: false
      description: Physical parcel with kind and quantity lineage. Replacement parcel has no new merchandise
        charge; an approved company-fault replacement has zero buyer COD collection. Do not sum replacement
        merchandise as a second sale. waybill_issued_at is trusted provider-backed issuance, distinct from
        handed_over and actual delivered_at.
    Order:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        number:
          type: string
        status:
          type: string
          enum:
