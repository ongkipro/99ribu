        default:
          description: Unexpected server/proxy failure; clients tolerate a non-Problem
            gateway body. Financial result may be unknown; recover the operation before
            retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: category_id
        in: query
        schema:
          $ref: '#/components/schemas/Id'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - relevance
          - newest
      - name: attributes
        in: query
        schema:
          type: string
          maxLength: 2000
        description: Validated category-specific filter expression; grammar must be
          frozen before client generation.
  /products/{productId}:
    get:
      operationId: getProduct
      summary: Read a published product and variants
      description: Proposed Serba 99ribu v1 contract; not implemented or deployed.
