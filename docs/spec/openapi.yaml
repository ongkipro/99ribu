      - affiliate_liability
      - cost_policy_version
      - basis
      - net_merchandise_revenue
      - recognized_hpp
      - gross_merchandise_profit
      - operating_expenses
      - operating_result
      - hpp_basis
      additionalProperties: false
      description: from inclusive/to exclusive period flows; cash, receivables and liabilities are closing balances
        at to, with data freshness as_of. Gross is merchandise before returns, not cash. Estimated contribution
        uses frozen order costs and estimated fees; realized contribution uses posted recognized revenue, actual
        allocated HPP, shipping subsidy, provider/COD fees, packaging, return loss and affiliate expense. Cash uses
        reconciled company cash only, excluding unsettled provider receivables. These are contribution figures,
        not net company profit; tax/overhead completeness must be explicit. Never derive cash from gross sales or
        subtract affiliate expense twice on payout. Net merchandise revenue deducts recognized discounts/refunds/returns
        under the finance policy; gross merchandise profit deducts recognized HPP. Operating result deducts recorded
        operating expenses from contribution and is not finalized net profit while taxes or other costs remain incomplete.
        HPP basis labels actual lot costs versus estimates. Inventory acquisition cash outflow is not a second COGS
        expense; affiliate payout settles its liability without recording the same expense again. Expense posting,
        allocation and period-close controls remain T-12 implementation scope; this read contract does not claim
