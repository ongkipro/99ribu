          $ref: '#/components/schemas/DateTime'
      required:
      - recipient_name
      - phone_masked
      - address_line
      - destination_id
      - province
      - city
      - district
      - subdistrict
      - postal_code
      - snapshot_at
      additionalProperties: false
      readOnly: true
      description: Original committed order ship-to snapshot, shown only on exact buyer-owned/verified guest
        receipt. Phone is server-masked; no full login/contact capability, current address-book record ID,
        email, account identity or bank proof. Canonical area display names freeze with the order. Later saved-address/contact
        edits or deletion never rewrite this snapshot; permitted shipment amendments require separately audited
        current parcel facts, not silent original-address replacement. Never place this object in general
        staff history, public metadata, notifications, analytics or shared caches.
    OfferDraftInput:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
        label:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        weight_grams:
          type: integer
          minimum: 1
        length_mm:
          type: integer
          minimum: 1
        width_mm:
          type: integer
          minimum: 1
        height_mm:
          type: integer
          minimum: 1
        default_warehouse_id:
          $ref: '#/components/schemas/Id'
        offer_kind:
          type: string
          enum:
          - unit
          - multipack
          - bundle
        contents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OfferContent'
          maxItems: 100
        image:
          $ref: '#/components/schemas/Image'
      required:
      - sku
      - label
      - attributes
      - weight_grams
      - length_mm
      - width_mm
      - height_mm
      - default_warehouse_id
      - offer_kind
      - contents
      additionalProperties: false
      description: Selected sellable option costs exactly IDR99000 for all included components, not per component.
        Unit has one component of quantity1; multipack has one component with quantity>=2; bundle has at least
        two distinct inventory components. Publication validates these rules, physical attributes, stock and
        category-required facts. Every component must be reservable atomically from one warehouse for the
        full selected quantity; do not split one offer across warehouses. New draft offer gets server-generated
        variant/catalog identity; optional selected image falls back to validated listing media. No client
        price/cost/stock balance/catalog-ID assignment.
      allOf:
      - if:
          properties:
            offer_kind:
              const: unit
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    const: 1
      - if:
          properties:
            offer_kind:
              const: multipack
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    minimum: 2
      - if:
          properties:
            offer_kind:
              const: bundle
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 2
    OfferUpdateInput:
      type: object
      properties:
        label:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Attribute'
        weight_grams:
          type: integer
          minimum: 1
        length_mm:
          type: integer
          minimum: 1
        width_mm:
          type: integer
          minimum: 1
        height_mm:
          type: integer
          minimum: 1
        default_warehouse_id:
          $ref: '#/components/schemas/Id'
        offer_kind:
          type: string
          enum:
          - unit
          - multipack
          - bundle
        contents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OfferContent'
          maxItems: 100
        image:
          $ref: '#/components/schemas/Image'
      required:
      - label
      - attributes
      - weight_grams
      - length_mm
      - width_mm
      - height_mm
      - default_warehouse_id
      - offer_kind
      - contents
      additionalProperties: false
      description: Full prospective editable offer definition for an existing variant. Stable variant/catalog
        IDs and SKU cannot be reassigned. Definition changes stage a new product draft revision; do not mutate
        committed order contents, stock reservations, old quotes or dispatched labels. Price remains server-fixed
        IDR99000; physical stock only moves through inventory domain. Publication rechecks category, components,
        warehouse, dimensions, media, stock and margin/cost policy.
      allOf:
      - if:
          properties:
            offer_kind:
              const: unit
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    const: 1
      - if:
          properties:
            offer_kind:
              const: multipack
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    minimum: 2
      - if:
          properties:
            offer_kind:
              const: bundle
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 2
    OfferDraftChange:
      type: object
      properties:
        operation:
          type: string
          enum:
          - create
          - update
          - retire
        variant_id:
          $ref: '#/components/schemas/Id'
        create:
          $ref: '#/components/schemas/OfferDraftInput'
        update:
          $ref: '#/components/schemas/OfferUpdateInput'
      required:
      - operation
      additionalProperties: false
      description: Explicit change only; omitted variants are preserved, never implicitly removed. Existing
        referenced/reserved/published identities are never hard-deleted or reused. Retirement removes future
        offers only at approved publication; active reservations/orders retain frozen definitions and valid
        fulfillment. Duplicate target IDs or conflicting operations rejected atomically.
      oneOf:
      - properties:
          operation:
            const: create
          create:
            $ref: '#/components/schemas/OfferDraftInput'
        required:
        - create
        not:
          anyOf:
          - properties:
              variant_id:
                $ref: '#/components/schemas/Id'
            required:
            - variant_id
          - properties:
              update:
                $ref: '#/components/schemas/OfferUpdateInput'
            required:
            - update
      - properties:
          operation:
            const: update
          variant_id:
            $ref: '#/components/schemas/Id'
          update:
            $ref: '#/components/schemas/OfferUpdateInput'
        required:
        - variant_id
        - update
        not:
          properties:
            create:
              $ref: '#/components/schemas/OfferDraftInput'
          required:
          - create
      - properties:
          operation:
            const: retire
          variant_id:
            $ref: '#/components/schemas/Id'
        required:
        - variant_id
        not:
          anyOf:
          - properties:
              create:
                $ref: '#/components/schemas/OfferDraftInput'
            required:
            - create
          - properties:
              update:
                $ref: '#/components/schemas/OfferUpdateInput'
            required:
            - update
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: 99ribu_session
      description: Proposed HttpOnly Secure browser session cookie name; configure
        auth adapter and CSRF/origin checks before implementation.
    bearerAuth:
      type: http
      scheme: bearer
      description: Proposed short-lived opaque access token for independent native
        clients. Issuance/refresh/revocation protocol remains an IAM design gate;
        not assumed JWT.
    cartAccess:
      type: apiKey
      in: header
      name: X-Cart-Token
      description: Short-lived cart-only capability; server binds request cart/quote.
        Never authorizes order read or staff operations.
    orderAccess:
      type: apiKey
      in: header
      name: X-Order-Token
      description: Short-lived verified guest capability bound to one order, including
        its payments/returns only; no list-all access.
    supportSession:
      type: apiKey
      in: cookie
      name: 99ribu_support_session
      description: Proposed HttpOnly Secure same-origin guest support session, server-bound to opaque guest
        identity and owned conversations. Issuance, CSRF, rotation, expiry and verified recovery are T-24
        release gates. Never authorizes orders, finance or staff operations.
    visitorSession:
      type: apiKey
      in: cookie
      name: 99ribu_visitor_session
      description: Proposed anonymous HttpOnly Secure SameSite first-party visitor context for consent/funnel
        only. Never authorizes buyer/staff/order/support history; issuance/rotation/expiry/CSRF frozen through
        supported IAM design.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Application retry contract: same actor/key/body returns original
        outcome; differing body returns 409. Retention must cover accepted retry/reconciliation
        window and be published before release. Never reuse key for another logical
        operation.'
      schema:
        type: string
        minLength: 16
        maxLength: 200
    Cursor:
      name: cursor
      in: query
      description: Opaque server cursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CartVersion:
      name: If-Match
      in: header
      required: true
      description: Expected cart version as quoted ETag, e.g. "3". GET Cart returns
        ETag. Stale version returns 409 under this draft API policy.
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    BadRequest:
      description: Invalid request or query.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired or invalid capability/session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role or object scope denied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource absent or concealed outside caller scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Stale version/quote, invalid transition, stock conflict or idempotency
        payload mismatch.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Domain validation failed; field_errors identify recoverable inputs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Request throttled; retry after delay.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: Retry delay in seconds.
          schema:
            type: integer
            minimum: 0
    Unavailable:
      description: Dependency unavailable; retry/reconcile the existing operation,
        do not assume failed side effect.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: Retry delay in seconds.
          schema:
            type: integer
            minimum: 0
