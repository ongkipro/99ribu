        on_hand:
          type: integer
          minimum: 0
          maximum: 2147483647
        reserved:
          type: integer
          minimum: 0
          maximum: 2147483647
        quarantined:
          type: integer
          minimum: 0
          maximum: 2147483647
        available:
          type: integer
          minimum: 0
          maximum: 2147483647
        version:
          type: integer
          minimum: 0
          maximum: 2147483647
