          - staff
      required:
      - conversation_id
      - last_seen_sequence
      - updated_at
      - reader_side
      additionalProperties: false
      description: Side of the actual acknowledged reader; never confuse own read with counterparty acknowledgement.
        Customer marker is their participant high-water mark. Public staff marker is the maximum actual acknowledged
        read among permitted CS participants; no staff identity is public.
    SupportClaimInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
      required:
      - expected_version
      additionalProperties: false
      description: Atomic claim of unassigned conversation by current authenticated CS actor, or idempotent
        same claimant. Concurrent/other claimant or stale version is 409; no client assignee arbitrary escalation.
    SupportStatusInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - open
          - waiting_customer
          - resolved
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - expected_version
      - status
      - reason
      additionalProperties: false
      description: Assigned CS actor or owner only; version checked and audited. New buyer message atomically
        reopens resolved/waiting_customer to open. Sending a CS reply alone does not silently mark buyer read
        or resolve.
    SupportAssignmentInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        assignee_user_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - expected_version
      - assignee_user_id
      - reason
      additionalProperties: false
      description: Owner or current assigned CS may transfer to an active customer_service staff member, or
        release to unassigned with null. Atomic version check/audit; never assign to buyer/warehouse/ecommerce
        staff without CS grant.
    SupportInternalNote:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        conversation_id:
          $ref: '#/components/schemas/Id'
        author_id:
          $ref: '#/components/schemas/Id'
        text:
          type: string
          minLength: 1
          maxLength: 4000
        created_at:
          $ref: '#/components/schemas/DateTime'
      required:
      - id
      - conversation_id
      - author_id
      - text
      - created_at
      additionalProperties: false
      description: Staff-only internal note, stored/read separately from public messages and buyer events.
        No public message sequence is consumed; never include in buyer payload, resume backlog, unread markers,
        notifications or stream. Creating a note does not advance public conversation updated_at, message/read
        sequences, unread counts, notifications or events.
