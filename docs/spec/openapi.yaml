        channel_code:
          type: string
        reff_id:
          type: string
        trx_id:
          type:
          - string
          - 'null'
        expected_amount:
          $ref: '#/components/schemas/Money'
        provider_total:
          type:
          - integer
          - 'null'
        admin_fee:
          type:
          - integer
          - 'null'
          description: Store-borne AutoLaris fee (DEC-008 (3)); posted as provider_fee_expense at settlement.
        refusal_code:
          type:
          - string
          - 'null'
          enum:
          - AUTOLARIS_TOTAL_MISMATCH
          - AUTOLARIS_AMOUNT_MISMATCH
          - null
        expires_at:
          $ref: '#/components/schemas/DateTime'
        order_status:
          type: string
        payment_status:
          type: string
        observation_count:
          type: integer
          minimum: 0
        latest_observation:
          type:
          - object
          - 'null'
          properties:
            source:
              type: string
              enum:
              - advice
              - manual
            classification:
              type: string
              enum:
              - pending
              - settled
              - unknown
              - failed
            rc:
              type:
              - string
              - 'null'
            ket:
              type:
              - string
              - 'null'
            amount:
              type:
              - integer
              - 'null'
            occurred_at:
              $ref: '#/components/schemas/DateTime'
            recorded_at:
              $ref: '#/components/schemas/DateTime'
          required:
          - source
          - classification
          - rc
          - ket
          - amount
          - occurred_at
          - recorded_at
          additionalProperties: false
      required:
      - id
      - order_id
      - order_number
      - status
      - currency
      - channel_code
      - reff_id
      - trx_id
      - expected_amount
      - provider_total
      - admin_fee
      - refusal_code
      - expires_at
      - order_status
      - payment_status
      - observation_count
      - latest_observation
      additionalProperties: false
    AutolarisPaymentList:
      type: object
      properties:
        data:
          type: array
