openapi: 3.1.0
info:
  title: Serba 99ribu First-party Commerce API
  version: 0.1.0-draft
  description: Planning contract for desktop web, dedicated mobile web/WebView and
    future Android/iOS clients. All routes, payloads, status codes and auth transports
    are PROPOSALS for a new system, not observed implemented endpoints. No vendor
    API routes are represented. Native token issuance, external payment handoff, provider
    callbacks and unresolved financial timing/rounding require approval before implementation.
  contact:
    name: Paduka Ongki
  license:
    name: Proprietary draft; distribution requires owner approval
servers:
- url: http://localhost:3000/api/v1
  description: Proposed local development only; no deployed server exists.
tags:
- name: Administration
  description: Administration operations; draft first-party contract.
- name: Affiliate
  description: Affiliate operations; draft first-party contract.
- name: Cart
  description: Cart operations; draft first-party contract.
- name: Catalog
  description: Catalog operations; draft first-party contract.
- name: Checkout
  description: Checkout operations; draft first-party contract.
- name: Finance
  description: Finance operations; draft first-party contract.
- name: Fulfillment
  description: Fulfillment operations; draft first-party contract.
- name: Identity
  description: Identity operations; draft first-party contract.
- name: Inventory
  description: Inventory operations; draft first-party contract.
- name: Operations
  description: Operations operations; draft first-party contract.
- name: Orders
  description: Orders operations; draft first-party contract.
- name: Payments
  description: Payments operations; draft first-party contract.
- name: Promotions
  description: Promotions operations; draft first-party contract.
- name: Returns
  description: Returns operations; draft first-party contract.
- name: Support
  description: Native website buyer and customer-service chat; proposed first-party contract.
- name: Shipping
  description: Shipping operations; draft first-party contract.
security: &id004
- &id001
  sessionCookie: []
- &id002
  bearerAuth: []
paths:
  /categories:
    get:
      operationId: listCategories
      summary: List published departments
      description: Proposed Serba 99ribu v1 contract; not implemented or deployed.
        Enforce server validation and caller object scope.
      tags:
      - Catalog
      security: []
      x-contract-status: proposal
      x-primary-requirement: PR-1
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected server/proxy failure; clients tolerate a non-Problem
            gateway body. Financial result may be unknown; recover the operation before
            retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /products:
    get:
      operationId: listProducts
      summary: Search and filter published products
      description: Proposed Serba 99ribu v1 contract; not implemented or deployed.
        Enforce server validation and caller object scope.
      tags:
      - Catalog
      security: []
      x-contract-status: proposal
      x-primary-requirement: PR-1
