        query:
          type: string
          minLength: 1
          maxLength: 200
        cursor:
          type: string
          minLength: 1
          maxLength: 2000
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        view:
          type: string
          enum:
          - active
          - archived
          - all
        status:
          type: string
          enum:
          - open
          - waiting_customer
          - resolved
      required:
      - query
      additionalProperties: false
      description: Own conversation-list metadata filter (safe title/context/status), never cross-thread message-body
        search. No query in URL/log/analytics; caller scope bound to every result/cursor.
    SupportContactBindingInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 0
        contact:
          $ref: '#/components/schemas/VerifiedContactInput'
        reauthentication_proof:
          type: string
          minLength: 16
          maxLength: 2000
      required:
      - expected_version
      - contact
      additionalProperties: false
      description: Optional verified recovery contact for the current owned support identity, without forced signup/email.
        Initial expected_version=0; changing an existing binding requires current original-identity reauthentication
        (a support.contact_rebind proof from /me/reauthentication-proofs for the signed-in user; a guest support
        identity has no reviewed reauthentication and is refused with 403 REAUTHENTICATION_REQUIRED) and new-contact proof.
        Guest verification writes only a first binding; a challenge staged at version 0 returns 409 VERSION_CONFLICT
        once a contact is verified. For signed-in users the proof gates challenge issuance only; verification
        stores no user-side recovery contact (version reads buyer_profile.phone_verified_at, not set by this flow). Contact text cannot discover/link old threads. Supported challenge transport and
        retention are IAM gates.
      allOf:
      - if:
          properties:
            expected_version:
              minimum: 1
        then:
          properties:
            reauthentication_proof:
              type: string
              minLength: 16
              maxLength: 2000
          required:
          - reauthentication_proof
    ReceiptShipToSnapshot:
      type: object
      properties:
        recipient_name:
          type: string
          minLength: 1
          maxLength: 200
        phone_masked:
          type: string
          pattern: '[*•]'
          minLength: 1
          maxLength: 40
        address_line:
          type: string
          minLength: 1
          maxLength: 500
        destination_id:
          $ref: '#/components/schemas/Id'
        province:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 200
        district:
          type: string
          minLength: 1
          maxLength: 200
        subdistrict:
          type: string
          minLength: 1
          maxLength: 200
        postal_code:
          type: string
          minLength: 1
          maxLength: 20
        rt:
          type: string
          maxLength: 10
        rw:
          type: string
          maxLength: 10
        landmark:
          type: string
          maxLength: 300
        snapshot_at:
          $ref: '#/components/schemas/DateTime'
      required:
