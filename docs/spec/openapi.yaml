      description: Report every selected original component balance, including zero-missing observations. Snapshot
        current quantities on the server. Initial reports require a positive shortage; a fresh all-zero reinspection
        can resolve an existing case. Later physical on-hand movements require reinspection before loss/cancellation,
        while reservation-only changes do not fabricate physical loss. expected_version always fences the original
        fulfillment. Reinspection additionally requires the exact existing case ID and case version; omitting it
        creates only a new case and cannot implicitly replace an active report or newer buyer consent. An actually
        accepted cancellation/refund retains its proposal and awaiting_source through positive or zero reinspection.
