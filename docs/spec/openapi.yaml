          $ref: '#/components/schemas/DateTime'
      required:
      - kind
      - title
      - availability
      - snapshot_at
      additionalProperties: false
      description: Typed server-derived safe sent-time context. Never includes addresses, tokens, bank proof/HPP
        or raw private order facts. Current availability and authorization are rechecked on opening; unavailable/redacted
        resource has safe fallback.
      oneOf:
      - properties:
          kind:
            const: product
          product_id:
            $ref: '#/components/schemas/Id'
        required:
        - product_id
        not:
          required:
          - order_id
          properties:
