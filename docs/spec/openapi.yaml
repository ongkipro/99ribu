          - 'null'
          minimum: 0
          description: Integer IDR per physical component unit; null is unknown, never an assumed zero.
        source:
          type: string
          minLength: 1
          maxLength: 500
        reason:
          type: string
          minLength: 1
          maxLength: 500
        effective_from:
          $ref: '#/components/schemas/DateTime'
        recorded_at:
          $ref: '#/components/schemas/DateTime'
        recorded_by:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
        currency:
          type: string
          const: IDR
      required:
      - id
      - stock_item_id
      - unit_cost
      - source
      - reason
      - effective_from
      - recorded_at
      - recorded_by
      - version
      - currency
      additionalProperties: false
      description: Immutable HPP version per physical component. Offer HPP is derived from component quantities,
        not an editable profit field.
