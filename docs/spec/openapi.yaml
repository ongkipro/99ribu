      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-request-body-limit-bytes: 16384
      requestBody:
        required: true
        content:
          application/json:
            schema:
