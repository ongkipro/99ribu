        or PII. order_placed is secondary and requires actual server-owned order creation; receipt_viewed is not
        revenue. The Idempotency-Key must equal client_event_id; the single identity binds visitor, normalized name/body
        and original occurrence. Retries recheck current resource authority but recover an already committed acknowledgement
        without requiring the old transient quote/publication state to remain current.
