openapi: 3.1.0
info:
  title: Serba 99ribu First-party Commerce API
  version: 0.1.0-draft
  description: First-party desktop and mobile web contract. Only operations marked implemented-local have executable
    localhost evidence; proposals remain unimplemented. No vendor routes or deployed service are claimed. Native
    account token issuance and live provider integration remain separate design and release gates.
  contact:
    name: Paduka Ongki
  license:
    name: Proprietary draft; distribution requires owner approval
servers:
- url: http://127.0.0.1:3099/api/v1
  description: Production-mode localhost only; no remote deployment is claimed.
tags:
- name: Administration
  description: Administration operations; draft first-party contract.
- name: Affiliate
  description: Affiliate operations; draft first-party contract.
- name: Cart
  description: Cart operations; draft first-party contract.
- name: Catalog
  description: Catalog operations; draft first-party contract.
- name: Checkout
  description: Checkout operations; draft first-party contract.
- name: Finance
  description: Finance operations; draft first-party contract.
- name: Fulfillment
  description: Fulfillment operations; draft first-party contract.
- name: Identity
  description: Identity operations; draft first-party contract.
- name: Inventory
  description: Inventory operations; draft first-party contract.
- name: Operations
  description: Operations operations; draft first-party contract.
- name: Orders
  description: Orders operations; draft first-party contract.
- name: Payments
  description: Payments operations; draft first-party contract.
- name: Promotions
  description: Promotions operations; draft first-party contract.
- name: Returns
  description: Returns operations; draft first-party contract.
- name: Support
  description: Native website buyer and customer-service chat; proposed first-party contract.
- name: Shipping
  description: Shipping operations; draft first-party contract.
security: &id001
- &id002
  sessionCookie: []
- &id003
  bearerAuth: []
paths:
  /categories:
    get:
      operationId: listCategories
      summary: List published departments
      description: Implemented localhost structurally published category tree and its ancestors. A category may
        be empty after product financial source invalidation. UUID cursor, no-store public read; no credentials.
      tags:
      - Catalog
      security: []
      x-contract-status: implemented-local
      x-domain-owner: catalog
      x-primary-requirement: PR-17
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected server/proxy failure; clients tolerate a non-Problem gateway body. Financial result
            may be unknown; recover the operation before retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 1024
          pattern: ^[A-Za-z0-9_-]+$
        description: Public continuation bound to normalized filters; not an access credential.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 24
      x-proof-group: storefront
      x-implementation: src/app/api/v1/categories/route.ts
  /products:
    get:
      operationId: listProducts
      summary: Search and filter published products
      description: Implemented localhost public read with actual immutable publication/source validation and whole-offer
        stock. No auth required; no live providers. No-store freshness; pagination may produce an empty page with
        a continuation after source invalidation.
      tags:
      - Catalog
      security: []
      x-contract-status: implemented-local
      x-domain-owner: catalog
      x-primary-requirement: PR-17
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontProductList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          description: Unexpected server/proxy failure; clients tolerate a non-Problem gateway body. Financial result
            may be unknown; recover the operation before retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 1024
          pattern: ^[A-Za-z0-9_-]+$
        description: Public continuation bound to normalized filters; not an access credential.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 40
          default: 24
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: category_id
        in: query
        schema:
          type: string
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - relevance
          - newest
      - name: offer_kind
        in: query
        schema:
          type: string
          enum:
          - ''
          - unit
          - multipack
          - bundle
      - name: availability
        in: query
        schema:
          type: string
          enum:
          - ''
          - available
          - unavailable
      - name: attributes
        in: query
        schema:
          type: string
          maxLength: 2000
        description: JSON object of category-defined attribute keys to arrays of 1–10 strings; at most10 keys. Requires
          category_id. AND across keys, OR within values, all keys on the same offer with product-fact fallback.
          Available filters report values on this page only. Empty category/offer_kind/availability means all.
      x-proof-group: storefront
      x-implementation: src/app/api/v1/products/route.ts
