            - shipping_total
            - package_count
            - origins
            additionalProperties: false
          minItems: 1
          maxItems: 20
        source:
          type: string
          const: TEST-ONLY
      required:
      - id
      - cart_id
      - cart_version
      - expires_at
      - payment_method
      - packages
      - merchandise_total
      - shipping_total
      - subsidy_total
      - buyer_total
      - currency
      - available_payment_methods
      - address
      - contact
      - selected_allocation_id
      - allocation_options
      - source
      additionalProperties: false
      description: Server-authoritative frozen proposal; payment/stock/promo validated again on order creation.
        COD collection amounts sum to buyer_total. Every selected_option_id must belong to its package options,
        support the selected method, and remain valid at order creation. Packages are nonempty. COD package collection
        amounts are required and sum exactly to buyer_total; JSON Schema cannot enforce cross-object arithmetic,
        so domain tests must.
      allOf:
      - if:
          properties:
            payment_method:
              const: cod
          required:
          - payment_method
        then:
          properties:
            packages:
              items:
                required:
                - cod_collect_amount
                properties:
                  cod_collect_amount:
                    $ref: '#/components/schemas/Money'
    QuoteSelection:
