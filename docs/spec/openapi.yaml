      - media_type
      - size_bytes
      - status
      additionalProperties: false
      description: Conversation-scoped private image metadata. Only ready attachments may be sent. MIME sniffing,
        malware scan, image decode/re-encode, decompression limits, EXIF stripping and scoped authorization required.
