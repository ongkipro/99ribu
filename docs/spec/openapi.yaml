        sequence after atomic commit, preserving reconnect order. Render plain text safely; attachments never mutate
        payment/refund/order state.
    SupportMessageInput:
      type: object
      properties:
        client_message_id:
          type: string
          minLength: 16
          maxLength: 100
        text:
          type: string
          maxLength: 4000
        attachment_ids:
          type: array
          maxItems: 3
          uniqueItems: true
