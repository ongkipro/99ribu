          - warehouse_calendar
          - payment
        warehouse_id:
          type:
          - string
          - 'null'
          format: uuid
        effective_at:
          type:
          - string
          - 'null'
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
          description: Null activates at trusted database wall time; an explicit UTC millisecond instant must be
            between acceptance and 366 days ahead. Later appends cannot precede the last scheduled instant. Committed
            retries recover the original instant.
        values:
          oneOf:
          - $ref: '#/components/schemas/CommercialPolicyValues'
          - $ref: '#/components/schemas/WarehouseCalendarValues'
          - $ref: '#/components/schemas/PaymentPolicyValues'
        expected_version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '[^\u0009-\u000D\u0020\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\uFEFF]'
          not:
            pattern: \u0000
        reauthentication_proof:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - kind
      - warehouse_id
      - effective_at
      - values
      - expected_version
      - reason
      - reauthentication_proof
      allOf:
      - if:
          properties:
            kind:
              const: commercial
        then:
          properties:
            warehouse_id:
              type: 'null'
            values:
              $ref: '#/components/schemas/CommercialPolicyValues'
        else:
          properties:
            warehouse_id:
              type: string
              format: uuid
            values:
              $ref: '#/components/schemas/WarehouseCalendarValues'
    PolicyVersion:
