    ManualTransferClaimInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        reauthentication_proof:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - expected_version
      - reauthentication_proof
      additionalProperties: false
      description: One exclusive finance claim binds actor, reserved amount and verified beneficiary snapshot.
        Proof is scoped to the action and never logged. A stale version or existing unresolved claim returns409;
        do not initiate a bank transfer after a failed claim.
    ManualTransferVerificationInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        transfer_claim_id:
          $ref: '#/components/schemas/Id'
        bank_transfer_reference:
          type: string
          minLength: 1
          maxLength: 200
        evidence_id:
          $ref: '#/components/schemas/Id'
        transferred_at:
          $ref: '#/components/schemas/DateTime'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        reauthentication_proof:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - expected_version
      - transfer_claim_id
      - bank_transfer_reference
      - evidence_id
      - transferred_at
      - reason
      - reauthentication_proof
      additionalProperties: false
      description: Staff assertion triggers verification, never grants paid status by itself. Validate evidence
        ownership/upload scanning, completed bank outcome, exact allocated amount and frozen beneficiary.
        Enforce unique bank reference in bank-account scope, claim/version lock and ledger append atomically.
        Reject mismatches; retain unknown transfers reserved. This is a finance-only audited manual operation,
        not an affiliate withdrawal.
    PayoutEvidenceInput:
      type: object
      properties:
        file_name:
          type: string
          minLength: 1
          maxLength: 200
        media_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - application/pdf
        size_bytes:
          type: integer
          minimum: 1
          maximum: 10485760
      required:
      - file_name
      - media_type
      - size_bytes
      additionalProperties: false
      description: Server generates a private payout/claim-scoped upload with short expiry. Validate MIME
        signatures, size and malware before evidence use; arbitrary public URLs are rejected. Payout proofs
        are never exposed to affiliates, analytics or public storage.
    ManualTransferClaim:
      type: object
      properties:
        payout:
          $ref: '#/components/schemas/Payout'
        beneficiary_snapshot:
          type: object
          properties:
            bank_code:
              type: string
            account_number:
              type: string
            account_holder_name:
              type: string
          required:
          - bank_code
          - account_number
          - account_holder_name
          additionalProperties: false
      required:
      - payout
      - beneficiary_snapshot
      additionalProperties: false
      description: Private finance-only claim result for the active claim holder after reauthentication. Includes
        exact verified frozen recipient so manual transfer is actionable. Use no-store; never log/export/cache
        or return to affiliate roles. Beneficiary changes affect only future payouts, not this claimed transfer.
    FinancialMetric:
      type: object
      properties:
        amount:
          type:
          - integer
          - 'null'
          description: Signed integer IDR; null when unknown. Contribution and cash may be negative.
        complete:
          type: boolean
        missing_inputs:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 100
      required:
      - amount
      - complete
      - missing_inputs
      additionalProperties: false
      description: Complete requires a non-null amount and no missing inputs. Unknown cost/fee inputs produce
        null, not zero or a misleading complete profit.
      allOf:
      - if:
          properties:
            complete:
              const: true
          required:
          - complete
        then:
          properties:
            amount:
              type: integer
            missing_inputs:
              maxItems: 0
      - if:
          properties:
            amount:
              type: 'null'
          required:
          - amount
        then:
          properties:
            complete:
              const: false
    AdminOrderSummary:
