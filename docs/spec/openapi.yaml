      - phone_masked
      - address_line
      - destination_id
      - province
      - city
      - district
      - subdistrict
      - postal_code
      - snapshot_at
      additionalProperties: false
      readOnly: true
      description: Original committed order ship-to snapshot, shown only on exact buyer-owned/verified guest receipt.
        Phone is server-masked; no full login/contact capability, current address-book record ID, email, account
        identity or bank proof. Canonical area display names freeze with the order. Later saved-address/contact
        edits or deletion never rewrite this snapshot; permitted shipment amendments require separately audited
        current parcel facts, not silent original-address replacement. Never place this object in general staff
        history, public metadata, notifications, analytics or shared caches.
    OfferDraftInput:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Z0-9_-]{1,100}$
        label:
          type: string
          minLength: 1
          maxLength: 200
        attributes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CatalogAttribute'
        weight_grams:
          type: integer
          minimum: 1
          maximum: 1000000
        length_mm:
          type: integer
          minimum: 1
          maximum: 10000
        width_mm:
          type: integer
          minimum: 1
          maximum: 10000
        height_mm:
          type: integer
          minimum: 1
          maximum: 10000
        default_warehouse_id:
          $ref: '#/components/schemas/CatalogUuid'
        offer_kind:
          type: string
          enum:
          - unit
          - multipack
          - bundle
        contents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CatalogContent'
          maxItems: 100
        image:
          $ref: '#/components/schemas/CatalogImage'
      required:
      - sku
      - label
      - attributes
      - weight_grams
      - length_mm
      - width_mm
      - height_mm
      - default_warehouse_id
      - offer_kind
      - contents
      additionalProperties: false
      description: Selected sellable option costs exactly IDR99000 for all included components, not per component.
        Unit has one component of quantity1; multipack has one component with quantity>=2; bundle has at least two
        distinct inventory components. Publication validates these rules, physical attributes, stock and category-required
        facts. Every component must be reservable atomically from one warehouse for the full selected quantity;
        do not split one offer across warehouses. New draft offer gets server-generated variant/catalog identity;
        optional selected image falls back to validated listing media. No client price/cost/stock balance/catalog-ID
        assignment.
      allOf:
      - if:
          properties:
            offer_kind:
              const: unit
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    const: 1
      - if:
          properties:
            offer_kind:
              const: multipack
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    minimum: 2
      - if:
          properties:
            offer_kind:
              const: bundle
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 2
    OfferUpdateInput:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        attributes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CatalogAttribute'
        weight_grams:
          type: integer
          minimum: 1
          maximum: 1000000
        length_mm:
          type: integer
          minimum: 1
          maximum: 10000
        width_mm:
          type: integer
          minimum: 1
          maximum: 10000
        height_mm:
          type: integer
          minimum: 1
          maximum: 10000
        default_warehouse_id:
          $ref: '#/components/schemas/CatalogUuid'
        offer_kind:
          type: string
          enum:
          - unit
          - multipack
          - bundle
        contents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CatalogContent'
          maxItems: 100
        image:
          $ref: '#/components/schemas/CatalogImage'
      required:
      - label
      - attributes
      - weight_grams
      - length_mm
      - width_mm
      - height_mm
      - default_warehouse_id
      - offer_kind
      - contents
      additionalProperties: false
      description: Full prospective editable offer definition for an existing variant. Stable variant/catalog IDs
        and SKU cannot be reassigned. Definition changes stage a new product draft revision; do not mutate committed
        order contents, stock reservations, old quotes or dispatched labels. Price remains server-fixed IDR99000;
        physical stock only moves through inventory domain. Publication rechecks category, components, warehouse,
        dimensions, media, stock and margin/cost policy.
      allOf:
      - if:
          properties:
            offer_kind:
              const: unit
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    const: 1
      - if:
          properties:
            offer_kind:
              const: multipack
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    minimum: 2
      - if:
          properties:
            offer_kind:
              const: bundle
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 2
    OfferDraftChange:
      type: object
      properties:
        operation:
          type: string
          enum:
          - create
          - update
          - retire
        variant_id:
          $ref: '#/components/schemas/CatalogUuid'
        create:
          $ref: '#/components/schemas/OfferDraftInput'
        update:
          $ref: '#/components/schemas/OfferUpdateInput'
      required:
      - operation
      additionalProperties: false
      description: Explicit change only; omitted variants are preserved, never implicitly removed. Existing referenced/reserved/published
        identities are never hard-deleted or reused. Retirement removes future offers only at approved publication;
        active reservations/orders retain frozen definitions and valid fulfillment. Duplicate target IDs or conflicting
        operations rejected atomically.
      oneOf:
      - properties:
          operation:
            const: create
          create:
            $ref: '#/components/schemas/OfferDraftInput'
        required:
        - create
        not:
          anyOf:
          - properties:
              variant_id:
                $ref: '#/components/schemas/CatalogUuid'
            required:
            - variant_id
          - properties:
              update:
                $ref: '#/components/schemas/OfferUpdateInput'
            required:
            - update
      - properties:
          operation:
            const: update
          variant_id:
            $ref: '#/components/schemas/CatalogUuid'
          update:
            $ref: '#/components/schemas/OfferUpdateInput'
        required:
        - variant_id
        - update
        not:
          properties:
            create:
              $ref: '#/components/schemas/OfferDraftInput'
          required:
          - create
      - properties:
          operation:
            const: retire
          variant_id:
            $ref: '#/components/schemas/CatalogUuid'
        required:
        - variant_id
        not:
          anyOf:
          - properties:
              create:
                $ref: '#/components/schemas/OfferDraftInput'
            required:
            - create
          - properties:
              update:
                $ref: '#/components/schemas/OfferUpdateInput'
            required:
            - update
