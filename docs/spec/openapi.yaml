      - client_message_id
      - text
      - attachment_ids
      additionalProperties: false
      description: Require non-whitespace text or at least one ready private attachment owned by this conversation.
        Actor+conversation+client_message_id is durable deduplication independent of short HTTP retry-key retention;
        different normalized body for the same ID is 409. Sender, sequence and timestamps are server-owned.
