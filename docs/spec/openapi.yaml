        buyer/verified guest can read the original recipient/address snapshot with masked contact; no identity hashes,
        bank proof, secret or browser Purchase envelope. Purchased contents are frozen OrderItem snapshots, never
        mutable product lookups. payment_state distinguishes an unknown current attempt from original Order payment
