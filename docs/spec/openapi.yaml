          type: integer
          minimum: 0
      required:
      - last_seen_sequence
      additionalProperties: false
      description: Monotonic reader-specific high-water mark, bounded by latest authorized public message
        sequence. Not a delivery/financial receipt; never changes the other party read marker.
    SupportReadMarker:
      type: object
      properties:
        conversation_id:
          $ref: '#/components/schemas/Id'
        last_seen_sequence:
          type: integer
          minimum: 0
