      - id
      - status
      - version
      - created_at
      - updated_at
      - last_message_sequence
      - buyer_last_read_sequence
      - staff_last_read_sequence
      additionalProperties: false
      description: Public conversation metadata only. order_id appears only after independently verified own-order
        binding; internal notes and staff identities/assignments are excluded. staff_last_read_sequence is
        the max actual acknowledged public-message sequence among permitted CS readers; each agent retains
        a separate private marker. Notes never advance public last_message_sequence, updated_at or read/unread
        counters.
    SupportConversationCreate:
      type: object
      properties:
        client_conversation_id:
          type: string
          minLength: 16
          maxLength: 100
        product_id:
          $ref: '#/components/schemas/Id'
        order_id:
          $ref: '#/components/schemas/Id'
      required:
      - client_conversation_id
      additionalProperties: false
      description: Guest session creation/recovery must first establish an opaque HttpOnly session-bound support
        capability; possession of order/customer number or referral/cart cookie never grants access. Optional
        product must be published. Optional order requires authenticated ownership or independently verified
        X-Order-Token for that exact order, never a number-only claim. Reject unauthorized context; do not
        create dangling bindings.
    SupportAttachment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        media_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
        size_bytes:
          type: integer
          minimum: 1
          maximum: 5242880
        status:
          type: string
          enum:
          - pending_scan
          - ready
          - rejected
      required:
      - id
      - media_type
      - size_bytes
      - status
      additionalProperties: false
      description: Conversation-scoped private image metadata. Only ready attachments may be sent. MIME sniffing,
        malware scan, image decode/re-encode, decompression limits, EXIF stripping and scoped authorization
        required. No public image or upload URL.
    SupportMessage:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        conversation_id:
          $ref: '#/components/schemas/Id'
        sequence:
          type: integer
          minimum: 1
        client_message_id:
          type: string
          minLength: 16
          maxLength: 100
        sender:
          type: string
          enum:
          - buyer
          - customer_service
        text:
          type: string
          maxLength: 4000
        attachments:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/SupportAttachment'
        created_at:
          $ref: '#/components/schemas/DateTime'
        reply:
          $ref: '#/components/schemas/SupportReplyProjection'
        context:
          $ref: '#/components/schemas/SupportContextCard'
      required:
      - id
      - conversation_id
      - sequence
      - client_message_id
      - sender
      - text
      - attachments
      - created_at
      additionalProperties: false
      description: Public durable message only, never internal notes. Server assigns stable unique conversation-local
        sequence after atomic commit, preserving reconnect order. Render plain text safely; attachments never
        mutate payment/refund/order state.
    SupportMessageInput:
      type: object
      properties:
        client_message_id:
          type: string
          minLength: 16
          maxLength: 100
        text:
          type: string
          maxLength: 4000
        attachment_ids:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
        reply_to_message_id:
          $ref: '#/components/schemas/Id'
        context:
          $ref: '#/components/schemas/SupportContextInput'
      required:
      - client_message_id
      - text
      - attachment_ids
      additionalProperties: false
      description: Require non-whitespace text or at least one ready private attachment owned by this conversation.
        Actor+conversation+client_message_id is durable deduplication independent of short HTTP retry-key
        retention; different normalized body for the same ID is 409. Sender, sequence and timestamps are server-owned.
      anyOf:
      - properties:
          text:
            minLength: 1
            pattern: \S
      - properties:
          attachment_ids:
            minItems: 1
    SupportConversationList:
      type: object
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SupportConversation'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
      additionalProperties: false
    SupportMessageList:
      type: object
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SupportMessage'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - data
      - pagination
      additionalProperties: false
    SupportReadInput:
      type: object
