        image:
          oneOf:
          - $ref: '#/components/schemas/CatalogImage'
          - type: 'null'
        offer_kind:
          type: string
          enum:
          - unit
          - multipack
          - bundle
        contents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CatalogContent'
        weight_grams:
          type: integer
          minimum: 1
          maximum: 1000000
        length_mm:
          type: integer
          minimum: 1
          maximum: 10000
        width_mm:
          type: integer
          minimum: 1
          maximum: 10000
        height_mm:
          type: integer
          minimum: 1
          maximum: 10000
        default_warehouse_id:
          $ref: '#/components/schemas/CatalogUuid'
      required:
      - id
      - catalog_id
      - sku
      - label
      - attributes
      - price
      - currency
      - availability
      - image
      - offer_kind
      - contents
      - weight_grams
      - length_mm
      - width_mm
      - height_mm
      - default_warehouse_id
      additionalProperties: false
      description: Selected sellable option costs exactly IDR99000 for all included components, not per component.
        Unit has one component of quantity1; multipack has one component with quantity>=2; bundle has at least two
        distinct inventory components. Publication validates these rules, physical attributes, stock and category-required
        facts. Every component must be reservable atomically from one warehouse for the full selected quantity;
        do not split one offer across warehouses.
      allOf:
      - if:
          properties:
            offer_kind:
              const: unit
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    const: 1
      - if:
          properties:
            offer_kind:
              const: multipack
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 1
              maxItems: 1
              items:
                properties:
                  quantity:
                    minimum: 2
      - if:
          properties:
            offer_kind:
              const: bundle
          required:
          - offer_kind
        then:
          properties:
            contents:
              minItems: 2
