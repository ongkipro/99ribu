      x-implementation: src/app/api/v1/orders/[orderId]/recovery-actions/route.ts
components:
  schemas:
    PaymentPolicyValues:
      type: object
      additionalProperties: false
      required:
      - cod_fee_bps
      properties:
        cod_fee_bps:
          type: integer
          minimum: 0
          maximum: 2000
          description: DEC-009 buyer COD fee in basis points (333 = 3.33%); frozen per quote.
        manual_bank_accounts:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required:
            - bank_name
            - account_number
            - account_holder
            properties:
              bank_name:
                type: string
                minLength: 2
                maxLength: 60
              account_number:
                type: string
                pattern: ^[0-9]{6,20}$
              account_holder:
                type: string
                minLength: 2
                maxLength: 100
      description: DEC-008/009 company payment policy (separate from commercial so publications stay valid).
    ManualTransfer:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        order_id:
          $ref: '#/components/schemas/Id'
        order_number:
          type: string
        status:
          type: string
        currency:
          type: string
          enum:
          - IDR
        order_total:
          $ref: '#/components/schemas/Money'
        transfer_code:
          type: integer
          minimum: 1
          maximum: 999
        expected_amount:
          $ref: '#/components/schemas/Money'
        expires_at:
          $ref: '#/components/schemas/DateTime'
        order_status:
          type: string
        payment_status:
          type: string
        accounts:
          type: array
          maxItems: 5
          description: Company accounts pinned by the order's payment policy version (the receiving account is one of them).
          items:
            type: object
            properties:
              bank_name:
                type: string
              account_number:
                type: string
                pattern: ^[0-9]{6,20}$
              account_holder:
                type: string
            required:
            - bank_name
            - account_number
            - account_holder
            additionalProperties: false
        confirmation:
          anyOf:
          - type: object
            properties:
              amount:
                $ref: '#/components/schemas/Money'
              bank_reference:
                type: string
              transferred_at:
                $ref: '#/components/schemas/DateTime'
              recorded_at:
                $ref: '#/components/schemas/DateTime'
              received_account_number:
                type:
                - string
                - 'null'
              late_transfer:
                type: boolean
                description: Transfer time at or after the buyer deadline (recovery, never a paid order).
              outcome:
                type: string
              reason:
                type:
                - string
                - 'null'
              mismatch:
                type: boolean
            required:
            - amount
            - bank_reference
            - transferred_at
            - recorded_at
            - received_account_number
            - late_transfer
            - outcome
            - reason
            - mismatch
            additionalProperties: false
          - type: 'null'
      required:
      - id
      - order_id
      - order_number
      - status
      - currency
      - order_total
      - transfer_code
      - expected_amount
      - expires_at
      - order_status
      - payment_status
      - accounts
      - confirmation
      additionalProperties: false
      description: DEC-008 manual bank transfer awaiting or holding a finance confirmation; a wrong amount or late transfer
        becomes a recovery case through the existing payment callback.
    ManualTransferList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ManualTransfer'
          maxItems: 100
      required:
      - data
      additionalProperties: false
    ManualTransferConfirmationInput:
      type: object
      properties:
        amount:
          type: integer
          minimum: 1
        bank_reference:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_./:-]{2,79}$
        account_number:
          type: string
          pattern: ^[0-9]{6,20}$
          description: Receiving company account; the trimmed upper-cased bank_reference is unique per account (BANK_REFERENCE_ALREADY_USED).
        transferred_at:
          $ref: '#/components/schemas/DateTime'
          description: Bank transfer time, between the attempt creation and now; it decides timeliness.
        late_transfer:
          type: boolean
          description: Must equal transferred_at >= the buyer deadline (LATE_TRANSFER_ACKNOWLEDGEMENT_REQUIRED otherwise).
        evidence:
          type: string
          minLength: 1
          maxLength: 500
        reason:
          type: string
          minLength: 1
          maxLength: 200
        reauthentication_proof:
          type: string
          minLength: 1
          maxLength: 100
          description: finance.reconcile proof bound to the attempt id.
      required:
      - amount
      - bank_reference
      - account_number
      - transferred_at
      - late_transfer
      - evidence
      - reason
      - reauthentication_proof
      additionalProperties: false
    AutolarisPayment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        order_id:
          $ref: '#/components/schemas/Id'
        order_number:
          type: string
        status:
          type: string
        currency:
          type: string
