  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: 99ribu-local.session_token
      x-transport-status: implemented-local
      description: Signed HttpOnly SameSite=Lax cookie in the fixed HTTP loopback profile. Secure is false only
        here. HTTPS production cookie settings and naming require the deployment gate. Mutations require exact Origin.
        No native token issuance.
    bearerAuth:
      x-transport-status: proposal-unissued
      type: http
      scheme: bearer
      description: Proposed short-lived opaque access token for independent native clients. Issuance/refresh/revocation
        protocol remains an IAM design gate; not assumed JWT.
    cartAccess:
      x-transport-status: implemented-local
      type: apiKey
      in: header
      name: X-Cart-Token
      description: Explicit header-mode cart capability, with its current creating commerceGuest context; never
        order read authority.
    orderAccess:
      x-transport-status: implemented-local
      type: apiKey
      in: header
      name: X-Order-Token
      description: Explicit header-mode single-order capability; parent creating guest context must remain unrevoked/unexpired.
        No account bearer issuance.
    supportSession:
      x-transport-status: proposal-unissued
      type: apiKey
      in: cookie
      name: 99ribu_support_session
      description: Proposed HttpOnly Secure same-origin guest support session, server-bound to opaque guest identity
        and owned conversations. Issuance, CSRF, rotation, expiry and verified recovery are T-24 release gates.
        Never authorizes orders, finance or staff operations.
    visitorSession:
      x-transport-status: implemented-local
      type: apiKey
      in: cookie
      name: 99ribu-local.visitor
      description: Local HttpOnly SameSite=Lax purpose-only context, root path, stored digest and runtime HMAC,
        10-minute inactive anonymous nonce then24-hour active lifetime without retry extension. Exact current account-session
        scope or anonymous browser scope. Never grants cart/order/account/staff rights. Secure is intentionally
        absent for the guarded HTTP loopback profile; remote activation remains gated.
    commerceGuest:
      type: apiKey
      in: cookie
      name: 99ribu-local.commerce_guest
      x-transport-status: implemented-local
      description: HttpOnly browser credential. Server checks persisted owner/current authority; orderCookie has
        an order-specific API path.
    cartCookie:
      type: apiKey
      in: cookie
      name: 99ribu-local.cart_access
      x-transport-status: implemented-local
      description: HttpOnly browser credential. Server checks persisted owner/current authority; orderCookie has
        an order-specific API path.
    orderCookie:
      type: apiKey
      in: cookie
      name: 99ribu-local.order_access
      x-transport-status: implemented-local
      description: HttpOnly browser credential. Server checks persisted owner/current authority; orderCookie has
        an order-specific API path.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Application retry contract: same actor/key/body returns original outcome; differing body returns
        409. Retention must cover accepted retry/reconciliation window and be published before release. Never reuse
        key for another logical operation.'
      schema:
        type: string
        minLength: 16
        maxLength: 200
        pattern: ^[A-Za-z0-9_-]{16,200}$
    Cursor:
      name: cursor
      in: query
      description: Opaque server cursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CartVersion:
      name: If-Match
      in: header
      required: true
      description: Expected cart version as quoted ETag, e.g. "3". GET Cart returns ETag. Stale version returns
        409 under this draft API policy.
      schema:
        type: string
        pattern: ^"[1-9][0-9]{0,9}"$
        description: Quoted current cart revision, for example "3".
  responses:
    BodyTooLarge:
      description: JSON request exceeds the 16384-byte limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: JSON media type is required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Invalid request or query.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired or invalid capability/session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role or object scope denied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource absent or concealed outside caller scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Stale version/quote, invalid transition, stock conflict or idempotency payload mismatch.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Domain validation failed; field_errors identify recoverable inputs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Request throttled; retry after delay.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: Retry delay in seconds.
          schema:
            type: integer
            minimum: 0
    Unavailable:
      description: Dependency unavailable; retry/reconcile the existing operation, do not assume failed side effect.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          description: Retry delay in seconds.
          schema:
            type: integer
            minimum: 0
    PreconditionRequired:
      description: Required current cart version missing or malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: JSON request exceeds the16KiB limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
