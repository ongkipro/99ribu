      additionalProperties: false
      description: Session credentials are delivered only by approved Secure HttpOnly SameSite cookie transport,
        never JSON/query/analytics. Native issuance is a separate IAM gate. No user/account/order facts are
        returned.
    SupportContextInput:
      type: object
      properties:
        kind:
          type: string
          enum:
          - product
          - order
        product_id:
          $ref: '#/components/schemas/Id'
        variant_id:
          $ref: '#/components/schemas/Id'
        order_id:
          $ref: '#/components/schemas/Id'
      required:
      - kind
      additionalProperties: false
      description: Server validates published product/selected offer or current independent own-order authorization.
        Explicit send only. No arbitrary card HTML or URLs. Context-only send still requires visible nonblank
        text; it cannot bypass SupportMessageInput text/image rule.
      oneOf:
      - properties:
          kind:
            const: product
          product_id:
            $ref: '#/components/schemas/Id'
        required:
        - product_id
        not:
          required:
          - order_id
          properties:
            order_id:
              $ref: '#/components/schemas/Id'
      - properties:
          kind:
            const: order
          order_id:
            $ref: '#/components/schemas/Id'
        required:
        - order_id
        not:
          anyOf:
          - required:
            - product_id
            properties:
              product_id:
                $ref: '#/components/schemas/Id'
          - required:
            - variant_id
            properties:
              variant_id:
                $ref: '#/components/schemas/Id'
    SupportContextCard:
      type: object
