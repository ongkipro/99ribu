# Production topology for a Coolify "Docker Compose" resource (S84). Values come only from the
# Coolify environment; nothing secret lives in this file. Deploying it is a gated DEPLOY step (S88).
#
# Migrations run in their own one-shot service that alone receives the owner password; web and
# worker start only after it exits 0 and never hold DATABASE_OWNER_PASSWORD (not even in PID 1).
x-runtime: &runtime
  build: .
  restart: unless-stopped
  volumes:
    - storage:/app/.local
  environment: &env
    NODE_ENV: production
    APP_ENV: production
    APP_ORIGIN: ${APP_ORIGIN:?}
    BETTER_AUTH_URL: ${APP_ORIGIN:?}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
    CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:?}
    DATABASE_HOST: ${DATABASE_HOST:?}
    DATABASE_PORT: ${DATABASE_PORT:-5432}
    DATABASE_SSL: ${DATABASE_SSL:-disable}
    DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?}
    PAYMENT_ADAPTER: disabled
    # S95: live Mengantar rates when Coolify sets SHIPPING_ADAPTER=mengantar with the two MENGANTAR_* values. Every
    # service gets the same three: Coolify injects its variables into every service regardless of a per-service
    # override (observed 2026-10-31: migrate refused a blanked key that Coolify had refilled), and the production
    # config refuses a Mengantar key unless SHIPPING_ADAPTER=mengantar.
    SHIPPING_ADAPTER: ${SHIPPING_ADAPTER:-disabled}
    MENGANTAR_BASE_URL: ${MENGANTAR_BASE_URL:-}
    MENGANTAR_API_KEY: ${MENGANTAR_API_KEY:-}
    ADS_ADAPTER: disabled
    NOTIFICATION_ADAPTER: disabled
    PAYOUT_ADAPTER: disabled
    EXTERNAL_DISPATCH: disabled

services:
  migrate:
    <<: *runtime
    restart: "no"
    command: ["node", "scripts/migrate.ts", "production"]
    healthcheck:
      disable: true
    # The owner password is a host file mounted into this service only (0400, uid 10001; Coolify refuses a variable
    # in a volume source, so the path is fixed), never an application
    # variable: Coolify writes every application variable into an env_file shared by all services (seen 2026-10-30).
    volumes:
      - /data/99ribu/secrets/database-owner-password:/run/secrets/database-owner-password:ro
    environment:
      <<: *env
      DATABASE_OWNER_PASSWORD_FILE: /run/secrets/database-owner-password

  web:
    <<: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *env
      PORT: "3000"
    expose:
      - "3000"

  worker:
    <<: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "scripts/worker.ts", "production"]
    environment:
      <<: *env
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat

volumes:
  storage:
